name: Pre-publication secret history scan

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  whole-history-secrets:
    name: Scan reachable Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch all branch and tag refs
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
      - name: Install versioned Gitleaks
        run: |
          set -euo pipefail
          go install github.com/gitleaks/gitleaks/v8@v8.24.3
          "$(go env GOPATH)/bin/gitleaks" version
      - name: Audit tracked and historical sensitive paths
        run: python scripts/audit_public_history_paths.py --history
      - name: Scan entire reachable history for secret contents
        if: always()
        run: |
          set -euo pipefail
          # Redact findings and do not upload a potentially sensitive report.
          "$(go env GOPATH)/bin/gitleaks" git --log-opts="--all" --redact --no-banner --exit-code 1 .
