# =============================================================================
# Sentinel-43 — Kubernetes deployment CI gate
#
# No CI existed in this repo before this workflow. It gates
# deploy/kubernetes/ (and anything that could affect it — the app image,
# core/middleware/sentinel_firewall.py's trusted-proxy handling, etc.) behind:
#   1. manifest rendering + schema/deprecated-API validation (kubeconform)
#   2. the Phase-12-equivalent security policy checklist
#      (scripts/k8s_policy_check.py — no root, read-only rootfs, pinned
#      images, resource limits, probes, NetworkPolicy coverage, no
#      publicly exposed datastore, no wildcard RBAC, no embedded secrets,
#      no hostPath,
#      automountServiceAccountToken false)
#   3. image build + vulnerability scan (Trivy)
#   4. the full pytest suite
#   5. an ephemeral kind cluster smoke-deploy (Calico for real NetworkPolicy
#      enforcement — kind's default CNI does not enforce it) exercising pods
#      Ready/non-root, migration completion, API health/bootstrap, explicit
#      allowed API->DB/core connectivity, and forbidden unlabeled-pod->DB/core
#      connectivity before unconditional cluster teardown.
#
# Does not touch Docker Compose — that path has its own tests
# (core/tests/) and isn't gated by anything in this file.
# =============================================================================
name: Kubernetes

on:
  pull_request:
    paths:
      - ".dockerignore"
      - "requirements*.txt"
      - "core/**"
      - "migrations/**"
      - "dashboard/**"
      - "browser_tests/**"
      - "deploy/**"
      - "docker-compose*.yml"
      - "scripts/k8s_policy_check.py"
      - "scripts/ci_live_tests.py"
      - "acceptance/**"
      - "scripts/acceptance*.py"
      - "scripts/deploy_preflight.py"
      - "scripts/install_*.py"
      - "tests/test_install_phase_*.py"
      - "scripts/k8s-validate.ps1"
      # Release-gate policy changes must receive the full CI evidence, too.
      - "docs/security/public-beta-reopening-gate.md"
      - ".github/workflows/k8s.yml"
  push:
    branches: [main]
    paths:
      - ".dockerignore"
      - "requirements*.txt"
      - "scripts/ci_live_tests.py"
      - "acceptance/**"
      - "scripts/acceptance*.py"
      - "core/**"
      - "migrations/**"
      - "dashboard/**"
      - "browser_tests/**"
      - "deploy/**"
      - "docker-compose*.yml"
      - "scripts/k8s_policy_check.py"
      - "scripts/deploy_preflight.py"
      - "scripts/install_*.py"
      - "tests/test_install_phase_*.py"
      - "scripts/k8s-validate.ps1"
      # Release-gate policy changes must receive the full CI evidence, too.
      - "docs/security/public-beta-reopening-gate.md"
      - ".github/workflows/k8s.yml"
  workflow_dispatch: {}

jobs:
  validate-manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          mkdir -p /tmp/kubeconform && tar -xzf /tmp/kubeconform.tar.gz -C /tmp/kubeconform
          sudo mv /tmp/kubeconform/kubeconform /usr/local/bin/kubeconform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate Compose files
        # `docker compose config` requires S43_SESSION_HASH_PEPPER to interpolate.
        # The check supplies a fresh, ephemeral, clearly non-production placeholder
        # (prefix "ci-compose-validation-only-NOT-A-SECRET-") to that one command
        # only; no secret store is read and nothing is deployed or started.
        run: python scripts/acceptance_campaign.py check compose

      - name: Render and validate every overlay
        run: |
          set -euo pipefail
          for overlay in base overlays/dev overlays/beta; do
            name=$(basename "$overlay")
            echo "=== $name ==="
            dir="deploy/kubernetes/$overlay"
            rendered="/tmp/rendered-$name.yaml"
            kubectl kustomize "$dir" > "$rendered"
            kubeconform -strict -summary -kubernetes-version 1.30.0 "$rendered"
            python scripts/k8s_policy_check.py "$rendered"
          done

  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.3
        env:
          POSTGRES_USER: s43_ci
          POSTGRES_PASSWORD: disposable-ci-database-only
          POSTGRES_DB: s43_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U s43_ci -d s43_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Install from the runtime manifest present in the merged checkout.
      # pytest and requests are the additional dependencies used by core/tests.
      - run: python -m pip install -r requirements.txt pytest requests
      # Zero-skip acceptance: jobs are defined in acceptance/suites.json and
      # run through scripts/acceptance_gate.py, which records every test ID's
      # outcome and fails on any skip/xfail/xpass/error/deselection.
      - name: Record the test inventory before execution
        run: |
          python scripts/acceptance_gate.py inventory --out acceptance_out --job core-isolated --job core-live
          # Only the interpreter this job has. The "browser" profile must be collected by
          # the browser venv (pytest-playwright adds "[chromium]" to node IDs), which is
          # done in the browser-smoke job below; verify requires BOTH profiles.
          python scripts/acceptance_gate.py inventory-all --out acceptance_out --profile main
      - name: Isolated application and security tests
        # Live tests run in the next required step against real processes.
        run: python scripts/acceptance_gate.py run-job core-isolated --out acceptance_out
      - name: Live API, PostgreSQL, and Watchtower tests
        env:
          S43_CI_DATABASE_URL: postgresql+asyncpg://s43_ci:disposable-ci-database-only@127.0.0.1:5432/s43_ci
          S43_ACCEPTANCE_OUT: acceptance_out
        run: python scripts/ci_live_tests.py
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-test
          path: acceptance_out/
          if-no-files-found: error

  pg-tests:
    # Beta's disposable-PostgreSQL suites (schema-version gate, migration
    # 0001->0003, browser session + refresh rotation/replay, break-glass,
    # WS session revocation, pg_dump/pg_restore recovery). These `*_pg.py`
    # files skip when S43_TEST_PG_DSN is unset -- run in their own job with a
    # dedicated database so they can DROP/CREATE freely without racing the
    # live-test sequencing in `test`.
    name: pytest (disposable PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.3
        env:
          POSTGRES_USER: s43t
          POSTGRES_PASSWORD: disposable-ci-database-only
          POSTGRES_DB: s43t
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U s43t -d s43t"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pytest requests
      - name: Run the PostgreSQL-backed suites
        env:
          S43_TEST_PG_DSN: postgresql+asyncpg://s43t:disposable-ci-database-only@127.0.0.1:55432/s43t
          # test_backup_restore_pg.py runs pg_dump/pg_restore via `docker exec`
          # against the service container.
          S43_TEST_PG_CONTAINER: ${{ job.services.postgres.id }}
          S43_WATCHTOWER_URL: http://127.0.0.1:19100
          S43_WATCHTOWER_TIMEOUT: "0.1"
          # core/api/main.py reads SENTINEL_ENV into module-level constants
          # (IS_LOCAL_ENV, _TRUSTED_HOSTS, JWT_SECRET, ...) exactly ONCE, at
          # the first `import core.api.main` in the process -- not per test,
          # regardless of a later monkeypatch.setenv. Several files here do
          # a deferred `import core.api.main` inside a test function without
          # ever setting SENTINEL_ENV themselves (test_schema_version_pg.py's
          # /ready and /health checks explicitly build a TestClient with NO
          # lifespan, so _validate_security_config() never runs for them --
          # they don't need this and were never the problem). Whichever file
          # happens to import it FIRST decides SENTINEL_ENV for the entire
          # job; with nothing set at this level that import saw "production"
          # (SENTINEL_ENV's own unset-fallback), and Pass A's non-local
          # startup checks (S43_TRUSTED_HOSTS, S43_TLS_TERMINATED_AT_TRUSTED_EDGE)
          # then failed every later test whose fixture DOES boot the full
          # lifespan (test_auth_session_pg.py, test_ws_session_pg.py) --
          # their own `monkeypatch.setenv("SENTINEL_ENV", "test")` was
          # already too late. Setting it once here, before pytest starts,
          # makes the outcome independent of import order.
          SENTINEL_ENV: test
          S43_ENV: test
        run: |
          set -euo pipefail
          python scripts/acceptance_gate.py inventory --out acceptance_out --job core-postgres
          python scripts/acceptance_gate.py run-job core-postgres --out acceptance_out
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-pg-tests
          path: acceptance_out/
          if-no-files-found: error

  browser-smoke:
    name: browser SPA smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Playwright + Chromium
        run: |
          python -m venv .venv-browser
          .venv-browser/bin/python -m pip install -r requirements-browser.txt
          .venv-browser/bin/python -m playwright install --with-deps chromium
      - name: Lint the runners + collect the target-acceptance suite
        # The target suite needs a real deployed target, so CI only checks it
        # parses and collects -- it must never be executed (or silently
        # skipped) here.
        run: |
          set -euo pipefail
          bash -n browser_tests/run.sh
          bash -n browser_tests/run_target.sh
          .venv-browser/bin/python -m pytest browser_tests/target_acceptance/ \
            --collect-only -q -p no:cacheprovider
      - name: Record the browser test inventory before execution
        env:
          S43_BROWSER_PYTHON: .venv-browser/bin/python
        run: |
          python scripts/acceptance_gate.py inventory --out acceptance_out --job browser-disposable --job browser-target
          python scripts/acceptance_gate.py inventory-all --out acceptance_out --profile browser
      - name: Run the browser SPA smoke against a disposable HTTPS stack
        env:
          S43_BROWSER_PYTHON: .venv-browser/bin/python
          S43_ACCEPTANCE_OUT: acceptance_out
        run: bash browser_tests/run.sh
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-browser-smoke
          path: acceptance_out/
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts
          path: |
            test-results/
          if-no-files-found: ignore

  build-and-scan:
    name: Build image + vulnerability scan
    runs-on: ubuntu-latest
    needs: [validate-manifests, test, pg-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Test application on the container runtime
        run: |
          set -euo pipefail
          docker build --target test -t sentinel43-api:test -f core/api/Dockerfile .
          mkdir -p acceptance_out
          python3 scripts/acceptance_gate.py revision --out acceptance_out
          mount="-v $PWD/acceptance_out:/out -e S43_ACC_REVISION_FILE=/out/revision.json"
          docker run --rm $mount sentinel43-api:test python scripts/acceptance_gate.py inventory --out /out --job core-isolated-container
          docker run --rm $mount sentinel43-api:test python scripts/acceptance_gate.py run-job core-isolated-container --out /out

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-container-tests
          path: acceptance_out/
          if-no-files-found: error

      - name: Build image
        run: docker build -t sentinel43-api:ci -f core/api/Dockerfile .

      - name: Trivy CVE scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sentinel43-api:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"
          format: table

  kind-smoke-deploy:
    name: kind smoke deploy
    runs-on: ubuntu-latest
    needs: [validate-manifests, test, pg-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sentinel43-api:ci -f core/api/Dockerfile .

      - name: Create kind cluster (default CNI disabled)
        uses: helm/kind-action@v1
        with:
          config: deploy/kubernetes/kind-cluster-config.yaml
          wait: "120s"

      - name: Install Calico (real NetworkPolicy enforcement)
        run: |
          set -euo pipefail
          kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/tigera-operator.yaml
          kubectl wait --for=condition=Established crd/installations.operator.tigera.io crd/apiservers.operator.tigera.io --timeout=120s
          kubectl -n tigera-operator rollout status deployment/tigera-operator --timeout=180s
          kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.29.1/manifests/custom-resources.yaml
          # The operator creates these asynchronously. Waiting for pods before
          # they exist exits immediately with "no matching resources found".
          kubectl -n calico-system wait --for=create daemonset/calico-node --timeout=180s
          kubectl -n calico-system rollout status daemonset/calico-node --timeout=180s
          kubectl -n calico-system wait --for=create deployment/calico-kube-controllers --timeout=180s
          kubectl -n calico-system rollout status deployment/calico-kube-controllers --timeout=180s
          kubectl -n kube-system wait --for=condition=Ready pods --all --timeout=120s

      - name: Load image into kind
        run: kind load docker-image sentinel43-api:ci --name $(kind get clusters | head -1)

      - name: Install standalone kustomize CLI
        # `kubectl kustomize` (bundled) can render, but `kustomize edit` —
        # used below to point the dev overlay at the freshly built CI image
        # tag — needs the standalone binary, which isn't preinstalled.
        run: |
          curl -fsSL -o /tmp/kustomize.tar.gz \
            https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz
          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo mv /tmp/kustomize /usr/local/bin/kustomize

      - name: Generate ephemeral CI secrets and deploy
        run: |
          set -euo pipefail
          kubectl create namespace sentinel43 --dry-run=client -o yaml | kubectl apply -f -
          gen() { python3 -c "import secrets; print(secrets.token_urlsafe(32))"; }
          # S43_OPERATOR_PASSWORD_HASH must be a real Argon2id hash -- core.api.main
          # ._validate_security_config() refuses to start otherwise outside
          # local/dev/test, which is exactly the failure this smoke deploy is
          # meant to catch, not paper over with a random token. Generated via the
          # already-built CI image (has argon2-cffi from requirements.txt) rather
          # than adding a separate Python/pip setup step to this job.
          gen_operator_hash() {
            docker run --rm sentinel43-api:ci python -c "
          import secrets
          from core.auth.users import hash_password
          print(hash_password(secrets.token_urlsafe(32)))
          "
          }
          # S43_AUDIT_HMAC_KEY must be HEX: core.audit.store decodes it with
          # bytes.fromhex and requires >= 32 decoded bytes, so a token_urlsafe
          # value is rejected.
          gen_hex() { python3 -c "import secrets; print(secrets.token_hex(32))"; }
          PG_PW=$(gen); OPERATOR_HASH=$(gen_operator_hash)
          # These are exactly the required keys in
          # deploy/kubernetes/base/secret.example.yaml. Keep the two lists in
          # step: a key that is required but never provisioned here means CI
          # smoke-deploys a configuration no operator can reproduce.
          kubectl create secret generic sentinel43-secrets -n sentinel43 \
            --from-literal=POSTGRES_PASSWORD="$PG_PW" \
            --from-literal=DATABASE_URL="postgresql+asyncpg://s43:${PG_PW}@s43-db:5432/s43" \
            --from-literal=S43_JWT_SECRET="$(gen)" \
            --from-literal=S43_BOOTSTRAP_CLAIM_TOKEN="$(gen)" \
            --from-literal=S43_OPERATOR_PASSWORD_HASH="$OPERATOR_HASH" \
            --from-literal=S43_AUTH_PEPPER="$(gen)" \
            --from-literal=S43_SESSION_HASH_PEPPER="$(gen)" \
            --from-literal=S43_AUDIT_HMAC_KEY="$(gen_hex)" \
            --from-literal=SENTINEL_LOG_SALT="$(gen_hex)" \
            --from-literal=S43_WATCHTOWER_SERVICE_TOKEN="$(gen)" \
            --from-literal=S43_FENRIR_API_TOKEN="$(gen)"
          cd deploy/kubernetes/overlays/dev
          kustomize edit set image sentinel43-api=sentinel43-api:ci
          cd -
          kubectl apply -k deploy/kubernetes/overlays/dev
          # Revert the local edit — CI runs in a fresh checkout each time,
          # but this keeps a local `act`-style run from leaving the repo
          # dirty if this workflow is ever run that way.
          git -C deploy/kubernetes/overlays/dev checkout -- kustomization.yaml || true

      - name: Wait for rollout
        run: |
          kubectl -n sentinel43 wait --for=condition=Ready pod -l app=s43-db --timeout=180s
          # The migration Job now waits for the database itself (see
          # base/migration-job.yaml's wait-for-db initContainer), so this no
          # longer depends on apply ordering.
          kubectl -n sentinel43 wait --for=condition=Complete job/s43-migration --timeout=300s
          kubectl -n sentinel43 rollout status deployment/s43-api --timeout=180s
          kubectl -n sentinel43 rollout status deployment/s43-core --timeout=180s

      - name: Security posture assertions
        run: |
          set -euo pipefail
          # The API is a singleton by design (see base/s43-api-deployment.yaml).
          # Assert it on the live cluster, not just in the rendered YAML.
          test "$(kubectl get deploy s43-api -n sentinel43 \
            -o jsonpath='{.spec.replicas}')" = "1"
          test "$(kubectl get deploy s43-api -n sentinel43 \
            -o jsonpath='{.spec.strategy.type}')" = "Recreate"
          # Watchtower must not be left FAILED by a startup race with s43-core
          # (the wait-for-core initContainer exists for this).
          kubectl exec -n sentinel43 deployment/s43-api -c s43-api -- python -c "
          import json, urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=10) as r:
              body = json.load(r)
          assert 'watchtower' not in body.get('degraded', []), body
          print('readiness:', body)
          "
          uid=$(kubectl exec -n sentinel43 deployment/s43-api -- id -u)
          test "$uid" = "65532"
          if kubectl exec -n sentinel43 deployment/s43-api -- sh -c 'touch /app/should_fail'; then
            echo "ERROR: application root filesystem is writable"
            exit 1
          fi

      - name: API smoke test
        run: |
          set -euo pipefail
          kubectl -n sentinel43 port-forward svc/s43-api 18000:8000 &
          sleep 3
          # A plain `curl http://localhost:18000/...` sends `Host:
          # localhost:18000` -- port-forward tunnels the TCP connection but
          # does not touch the Host header a client sends. TrustedHostGuard
          # (core/api/middleware/security_headers.py) enforces
          # S43_TRUSTED_HOSTS regardless of profile, and the dev overlay's
          # ConfigMap trusts "s43-api" (the name Fenrir's own self-report
          # traffic uses, deploy/kubernetes/base/configmap.yaml), not
          # "localhost". Sending that same Host here is what a legitimate
          # in-cluster caller's request actually looks like, and is the
          # honest fix: it exercises the real trusted-host list instead of
          # adding "localhost" to it, which would need to be maintained
          # forever for a value nothing but this smoke test ever sends.
          # /health is in the guard's exempt-path allowlist and would pass
          # either way; sent identically for a representative smoke test.
          curl -fsS -H "Host: s43-api" http://localhost:18000/health
          curl -fsS -H "Host: s43-api" http://localhost:18000/bootstrap/status

      - name: Verify NetworkPolicy enforcement
        run: |
          set -euo pipefail
          mkdir -p acceptance_out/jobs
          log="acceptance_out/jobs/check-kind-smoke.log"
          exec > >(tee -a "$log") 2>&1

          # First prove the allowed client path is alive. A later denied probe
          # is not useful evidence if the destination itself is unavailable.
          kubectl exec -n sentinel43 deployment/s43-api -c s43-api -- python -c             "import socket; s=socket.create_connection(('s43-db',5432),5); s.close(); print('ALLOW api -> db: PASS')"
          kubectl exec -n sentinel43 deployment/s43-api -c s43-api -- python -c             "import socket; s=socket.create_connection(('s43-core',9100),5); s.close(); print('ALLOW api -> core: PASS')"

          # PSS-restricted, deliberately UNLABELED client. Base default-deny
          # plus the DB/core allow policies must refuse both connections.
          cleanup() {
            kubectl delete pod netpol-test -n sentinel43 --ignore-not-found=true --wait=false >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          kubectl run netpol-test -n sentinel43 --image=busybox:1.36 --restart=Never             --overrides='{"spec":{"automountServiceAccountToken":false,"securityContext":{"runAsNonRoot":true,"runAsUser":65532,"runAsGroup":65532,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"netpol-test","image":"busybox:1.36","command":["sleep","3600"],"securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"privileged":false,"capabilities":{"drop":["ALL"]},"seccompProfile":{"type":"RuntimeDefault"}}}]}}'             --command -- sleep 3600
          kubectl wait --for=condition=Ready pod/netpol-test -n sentinel43 --timeout=60s

          DB_IP=$(kubectl get svc s43-db -n sentinel43 -o jsonpath='{.spec.clusterIP}')
          CORE_IP=$(kubectl get svc s43-core -n sentinel43 -o jsonpath='{.spec.clusterIP}')
          test -n "$DB_IP"
          test -n "$CORE_IP"

          if kubectl exec -n sentinel43 netpol-test -- timeout 5 nc -zv "$DB_IP" 5432; then
            echo "DENY unlabeled -> db: FAIL (connection unexpectedly succeeded)"
            exit 1
          else
            echo "DENY unlabeled -> db: PASS"
          fi

          if kubectl exec -n sentinel43 netpol-test -- timeout 5 nc -zv "$CORE_IP" 9100; then
            echo "DENY unlabeled -> core: FAIL (connection unexpectedly succeeded)"
            exit 1
          else
            echo "DENY unlabeled -> core: PASS"
          fi

          cleanup
          trap - EXIT

      - name: Record exact-revision kind acceptance evidence
        run: |
          set -euo pipefail
          mkdir -p acceptance_out
          python scripts/acceptance_gate.py revision --out acceptance_out
          python scripts/acceptance_gate.py record-ci check-kind-smoke --out acceptance_out --result success

      - name: Upload kind acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-kind-smoke
          path: |
            acceptance_out/jobs/check-kind-smoke.meta.json
            acceptance_out/jobs/check-kind-smoke.log
            acceptance_out/revision.json
          if-no-files-found: warn

      - name: Teardown
        if: always()
        run: kind delete cluster --name $(kind get clusters | head -1) || true

  acceptance-gate:
    # Zero-skip PR-CI verdict. A green status on the jobs above is NOT
    # sufficient: this job re-derives the verdict from the per-test-ID result
    # artifacts and fails on any skip/xfail/xpass/error/deselection, any missing
    # or incomplete artifact, and any PR-CI-owned job that was skipped, cancelled
    # or unsuccessful.
    #
    # This is `verify --mode pr-ci`, NOT final beta acceptance. Ordinary PR CI
    # provisions no authorized deployed target or credentials, so browser-target
    # is recorded as "NOT PERFORMED IN PR CI" (never as passed) and a PR-CI PASS
    # means only that everything PR CI owns executed with valid evidence. Final
    # beta acceptance (`verify --mode final-beta`) still requires browser-target
    # and every other required job; the mode is always explicit, never inferred
    # from which credentials happen to be present.
    name: Acceptance gate (zero-skip, PR-CI scope)
    if: always()
    needs: [validate-manifests, test, pg-tests, browser-smoke, build-and-scan, kind-smoke-deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: acceptance-*
          path: acceptance_out
          merge-multiple: true
      - name: Record required-check conclusions and unmet prerequisites
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          mkdir -p acceptance_out
          res() { python -c "import json,os;print(json.loads(os.environ['NEEDS'])['$1']['result'])"; }
          for job in check-compose-config check-k8s-policy check-kubeconform; do
            python scripts/acceptance_gate.py record-ci "$job" --out acceptance_out --result "$(res validate-manifests)"
          done
          python scripts/acceptance_gate.py record-ci check-image-scan --out acceptance_out --result "$(res build-and-scan)"
          python scripts/acceptance_gate.py record-ci check-kind-smoke --out acceptance_out --result "$(res kind-smoke-deploy)"
      - name: Verify PR-CI-owned work (fails the workflow unless PR-CI PASS; not final beta acceptance)
        run: python scripts/acceptance_gate.py verify --out acceptance_out --mode pr-ci
      - name: Upload verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-verdict
          path: acceptance_out/verdict.*
          if-no-files-found: warn
