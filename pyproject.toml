# =============================================================================
# Sentinel-43 — pyproject.toml entry point snippet
#
# Merge this into your existing pyproject.toml (or create one if absent).
# After merging, install in editable mode:
#   pip install -e .
# Then the generator is available as a system command:
#   s43-generate-secrets --help
#   s43-generate-secrets --write .env
#   s43-generate-secrets --check .env
# =============================================================================

# If you do not have a pyproject.toml yet, use this minimal version:

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "sentinel-43"
version = "0.1.0"
requires-python = ">=3.11"
# Add your actual runtime dependencies here.

[project.scripts]
# Installed CLI entry point. After `pip install -e .`, this is available
# as `s43-generate-secrets` anywhere in the activated virtualenv.
s43-generate-secrets = "core.cli.generate_secrets:main"

# If you already have a [project.scripts] section, add only this line:
#   s43-generate-secrets = "core.cli.generate_secrets:main"