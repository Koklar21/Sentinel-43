# =============================================================================
# Sentinel-43 -- reverse proxy / TLS terminator for the Docker Compose beta
# (beta-execution Phase 2, F-TLS-1).
#
# This is the Compose equivalent of deploy/kubernetes/overlays/beta/ingress.yaml
# (ingress-nginx). It:
#   * terminates TLS on :443 and 308-redirects all :80 traffic to https
#   * proxies to the internal s43-api:8000 (which is NOT host-published)
#   * sets X-Forwarded-Proto: https and X-Forwarded-For so the app knows the
#     external scheme and client -- the app trusts these only from this
#     proxy's IP (S43_TRUSTED_PROXIES on s43-api)
#   * sends HSTS + the static hardening headers at the edge
#   * upgrades WebSocket (/ws) connections
#
# Certificates: mount a real cert/key at /etc/nginx/certs/s43.{crt,key}. For
# local testing, deploy/proxy/generate-dev-cert.{sh,ps1} writes a self-signed
# pair there. Provisioning/renewal for a real target is the operator's --
# see deploy/proxy/README.md.
# =============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # Matches FirewallConfig.max_content_length_bytes (10 MiB) so an oversize
    # body is rejected at the edge with 413 rather than reaching the app.
    client_max_body_size 10m;
    client_body_timeout  30s;
    client_header_timeout 15s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format s43 '$remote_addr - $host "$request" $status $body_bytes_sent '
                   'rt=$request_time uct=$upstream_connect_time';
    access_log /var/log/nginx/access.log s43;

    # --- :80 -> :443 -------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        # 308 keeps the method + body on redirect (POST /auth/login etc).
        return 308 https://$host$request_uri;
    }

    # --- :443 TLS ---------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/s43.crt;
        ssl_certificate_key /etc/nginx/certs/s43.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            proxy_pass http://s43-api:8000;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;

            # WebSocket upgrade for /ws
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_send_timeout    30s;
            proxy_read_timeout    75s;   # > dashboard WS heartbeat (25s)
        }
    }
}
