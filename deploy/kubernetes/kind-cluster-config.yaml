kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: s43-test

# kindnet is disabled because this integration environment must use a
# NetworkPolicy-capable CNI. scripts/k8s-kind-test.ps1 installs Calico
# before Sentinel-43 workloads are deployed.
networking:
  disableDefaultCNI: true
  podSubnet: "192.168.0.0/16"

nodes:
  - role: control-plane
