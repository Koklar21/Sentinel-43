# One dedicated ServiceAccount per workload. None of Sentinel-43's processes
# call the Kubernetes API (no operators, no controllers, no client-go/kubectl
# usage anywhere in core/) — verified by grep for kubernetes client imports
# across the repo. So every SA disables token automounting, and no Role or
# RoleBindings exist anywhere in this deployment: granting API access nobody
# needs, just to look complete, would violate least-privilege for no benefit.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s43-api
  namespace: sentinel43
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s43-core
  namespace: sentinel43
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s43-db
  namespace: sentinel43
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s43-redis
  namespace: sentinel43
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: s43-migration
  namespace: sentinel43
automountServiceAccountToken: false
