# Default-deny for every pod in the namespace, both ingress and egress.
#
# Other NetworkPolicies in this deployment add explicit allow rules.
# NetworkPolicy rules are additive: traffic remains denied unless at least
# one applicable policy explicitly allows it.
#
# Enforcement depends on the cluster CNI implementing Kubernetes
# NetworkPolicy. Presence of these objects alone does not prove enforcement;
# deployment integration tests must verify actual traffic isolation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: default-deny-all
  namespace: sentinel43

spec:
  podSelector: {}

  policyTypes:
    - Ingress
    - Egress
