# Non-secret configuration only.
# Sensitive values belong in the sentinel43-secrets Secret.
# Never apply example secret manifests as-is.

apiVersion: v1
kind: ConfigMap

metadata:
  name: sentinel43-config
  namespace: sentinel43

data:
  # Environment / logging
  S43_ENV: "production"
  S43_LOG_LEVEL: "INFO"

  # Database
  POSTGRES_DB: "s43"
  POSTGRES_USER: "s43"
  S43_DB_PATH: "/app/sentinel43_state/sentinel43.sqlite3"

  # Watchtower / internal service routing
  S43_WATCHTOWER_HOST: "0.0.0.0"
  S43_WATCHTOWER_PORT: "9100"
  S43_WATCHTOWER_URL: "http://s43-core:9100"
  S43_WATCHTOWER_TIMEOUT: "2.0"

  # Canonical JWT configuration
  S43_JWT_ALGORITHM: "HS256"
  S43_JWT_ISSUER: "sentinel-43"
  S43_JWT_AUDIENCE: "sentinel-43-dashboard"
  S43_JWT_TTL_SECONDS: "28800"

  # Operator / session configuration
  S43_OPERATOR_USERNAME: "operator"
  S43_WS_REQUIRE_AUTH: "true"
  S43_SESSION_ACCESS_TTL_SECONDS: "900"
  S43_SESSION_REFRESH_TTL_SECONDS: "604800"
  S43_WS_SESSION_RECHECK_SECONDS: "60"

  # Trusted proxy handling
  # Empty means trust no proxy-provided forwarding headers.
  # Production overlays must explicitly set the ingress-controller network.
  S43_TRUSTED_PROXIES: ""

  # Fenrir
  # Fenrir uses canonical Sentinel-43 authentication. It does not own a
  # separate JWT secret, issuer, audience, or auth-disable switch.
  S43_FENRIR_ENABLED: "true"
  S43_FENRIR_NODE_ID: "sentinel-43-primary"
  S43_FENRIR_MIN_SEVERITY: "MEDIUM"
  S43_FENRIR_ANOMALY_ZSCORE: "2.5"
  S43_FENRIR_ANOMALY_DECAY: "0.002"
  S43_FENRIR_MAX_HONEYPOT_EVENTS: "500"
  S43_FENRIR_WATCHTOWER_URL: "http://s43-api:8000/watchtower/events"
  S43_FENRIR_BROADCAST_URL: "http://s43-api:8000/internal/events/broadcast"
  S43_FENRIR_REPORT_TIMEOUT: "2.0"

  # Feature gates
  # Never true outside local/dev/test.
  S43_ENABLE_TEST_INJECTION: "false"

  # Only SHADOW and HUMAN_GATED are valid governance modes.
  S43_GOVERNANCE_ENABLED: "false"
  S43_DEFAULT_MODE: "HUMAN_GATED"

  # Optional subsystems
  S43_SPARTA_ENABLED: "false"
  S43_JORM_ENABLED: "false"
