# Single-instance Redis, StatefulSet + PVC for the same reasons as
# postgres-statefulset.yaml. Note (see deploy/kubernetes/README.md's
# "Known limitations"): nothing in core/ currently opens a Redis connection
# — REDIS_URL is wired through as config (matching docker-compose.yml) but
# unused by any live code path today. It's provisioned here for parity with
# Compose and forward-compatibility, not because the app depends on it yet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s43-redis
  namespace: sentinel43
  labels: {app: s43-redis}
spec:
  serviceName: s43-redis
  replicas: 1
  updateStrategy: {type: RollingUpdate}
  podManagementPolicy: OrderedReady
  selector:
    matchLabels: {app: s43-redis}
  template:
    metadata:
      labels: {app: s43-redis}
    spec:
      serviceAccountName: s43-redis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: redis:7.2
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--dir", "/data"]
          ports:
            - {containerPort: 6379, name: redis}
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: sentinel43-secrets, key: REDIS_PASSWORD}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            exec: {command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: {command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]}
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 6
          startupProbe:
            exec: {command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping"]}
            periodSeconds: 3
            failureThreshold: 20
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {app: s43-redis}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: s43-redis
  namespace: sentinel43
  labels: {app: s43-redis}
spec:
  clusterIP: None
  selector: {app: s43-redis}
  ports:
    - {port: 6379, targetPort: 6379, name: redis}
