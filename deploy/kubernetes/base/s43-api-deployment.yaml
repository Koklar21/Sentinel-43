apiVersion: apps/v1
kind: Deployment
metadata:
  name: s43-api
  namespace: sentinel43
  labels: {app: s43-api}
spec:
  # REPLICA SAFETY: the API is single-replica-safe ONLY. This is a property of
  # the current application, not a scaling preference:
  #   - core/reliability.py's IdempotencyLedger is an in-process dict, so a
  #     second replica has its own ledger and would process the same event_id
  #     a second time -- duplicate analysis and duplicate alerts.
  #   - FenrirHunter and the SpartaCore watchdog are started per API process,
  #     so N replicas means N copies of each producer generating findings.
  #   - _broadcast_dashboard_event only reaches WebSocket clients attached to
  #     the replica that handled the event, so a dashboard on replica A would
  #     silently miss events distributed by replica B.
  #   - the audit and dead-letter SQLite files live on a ReadWriteOnce PVC
  #     mounted below; concurrent writers would risk corrupting them.
  # Scaling out requires shared idempotency/broadcast state first. Until then
  # this stays 1, and the strategy below keeps it 1 even mid-rollout.
  replicas: 1
  strategy:
    # Recreate, NOT RollingUpdate: maxSurge would briefly run a second API
    # pod, which is exactly the doubled-singleton state described above, and
    # the new pod could not attach the ReadWriteOnce PVC anyway.
    type: Recreate
  selector:
    matchLabels: {app: s43-api}
  template:
    metadata:
      labels:
        app: s43-api
        network/s43-db-client: "true"
        network/s43-core-client: "true"
    spec:
      serviceAccountName: s43-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Wait for s43-core to accept connections before starting the API.
        #
        # This mirrors docker-compose.yml's `depends_on: s43-core:
        # {condition: service_started}`, which Kubernetes has no equivalent
        # for -- and the absence was not harmless. Observed on a live
        # cluster: with everything applied at once, the API came up first,
        # its Watchtower registration hit ConnectionRefusedError three times
        # (modules/register, modules/heartbeat, dependencies/report), and the
        # `watchtower` subsystem was left FAILED. It stayed FAILED for the
        # life of the pod even after s43-core was serving and events were
        # being delivered to it successfully -- so /system/status told an
        # operator a healthy subsystem was broken.
        #
        # NOTE the exit code: unlike the migration Job's wait-for-db, this
        # exits 0 on timeout instead of failing. Watchtower is an OPTIONAL
        # subsystem -- readiness reports it as degraded, not blocking -- so a
        # genuinely absent s43-core must still leave the API able to start
        # and say so. This container removes a startup race; it does not
        # turn an optional dependency into a required one.
        - name: wait-for-core
          image: sentinel43-api:base-placeholder
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import os, socket, sys, time
              from urllib.parse import urlsplit

              url = urlsplit(os.environ.get("S43_WATCHTOWER_URL", ""))
              host, port = url.hostname or "s43-core", url.port or 9100
              deadline = time.monotonic() + 120

              while time.monotonic() < deadline:
                  try:
                      with socket.create_connection((host, port), timeout=5):
                          print(f"{host}:{port} is accepting connections")
                          sys.exit(0)
                  except OSError as exc:
                      print(f"waiting for {host}:{port}: {exc}", flush=True)
                      time.sleep(2)

              print(
                  f"{host}:{port} did not answer; starting anyway -- "
                  f"Watchtower is optional and will be reported degraded",
                  flush=True,
              )
              sys.exit(0)
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          envFrom:
            - configMapRef: {name: sentinel43-config}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}

      containers:
        - name: s43-api
          image: sentinel43-api:base-placeholder  # overridden by every overlay
          imagePullPolicy: IfNotPresent
          # --forwarded-allow-ips pins uvicorn's default (127.0.0.1) so a
          # FORWARDED_ALLOW_IPS env cannot make uvicorn trust X-Forwarded-For
          # from arbitrary peers and rewrite the client IP before
          # SentinelFirewall sees it. S43_TRUSTED_PROXIES is the authoritative
          # proxy-trust control (docs/security/trusted_proxy_handling.md).
          # Behind an ingress, set this flag to the ingress controller's
          # address AND S43_TRUSTED_PROXIES to the matching CIDR.
          command: ["uvicorn", "core.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--forwarded-allow-ips", "127.0.0.1"]
          ports:
            - {containerPort: 8000, name: http}
          # Runtime/deployment provenance for SentinelNode. These are supplied
          # by Kubernetes' Downward API and are observational metadata only;
          # the service-account token remains unmounted and none of these
          # fields establishes authentication or decision authority.
          env:
            - name: S43_RUNTIME_PLATFORM
              value: "kubernetes"
            - name: S43_RUNTIME_ROLE
              value: "api"
            - name: S43_K8S_WORKLOAD
              value: "s43-api"
            - name: S43_K8S_POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: S43_K8S_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: S43_K8S_NODE_NAME
              valueFrom:
                fieldRef: {fieldPath: spec.nodeName}
            - name: S43_K8S_POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
            - name: S43_K8S_SERVICE_ACCOUNT
              valueFrom:
                fieldRef: {fieldPath: spec.serviceAccountName}
          envFrom:
            - configMapRef: {name: sentinel43-config}
            - secretRef: {name: sentinel43-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: state, mountPath: /app/sentinel43_state}
            - {name: logs, mountPath: /app/logs}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 1000m, memory: 512Mi}
          # liveness = /health (process up; never touches the DB, so a DB
          # outage or a schema mismatch cannot make k8s kill every pod).
          # readiness = /ready, which connects to Postgres and returns 503
          # while alembic_version is behind/ahead/missing (schema_version.py)
          # -- so a pod pointed at an un-migrated database is kept out of the
          # Service until the s43-migration Job completes.
          # readiness also reflects the subsystem dependency graph: /ready
          # returns 503 while a REQUIRED subsystem (see core/lifecycle.py)
          # is not ACTIVE, so a pod whose Watchtower/audit wiring failed to
          # start never receives traffic.
          # There is no "previously-serving replica stays up" here: the
          # Deployment is a Recreate singleton, so a rollout is a short,
          # deliberate gap rather than an overlap.
          startupProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: state
          persistentVolumeClaim: {claimName: s43-api-state}
---
# Durable runtime state, mirroring docker-compose.yml's sentinel43_state
# volume. This IS load-bearing (it was not when this PVC was first written,
# and the note that used to sit here saying nothing writes here is now
# wrong). Two SQLite databases live on it:
#   /app/sentinel43_state/audit.sqlite3        S43_AUDIT_SQLITE_PATH -- the
#       authoritative HMAC-chained audit ledger
#   /app/sentinel43_state/dead_letter.sqlite3  S43_DEAD_LETTER_PATH -- failed
#       events awaiting operator replay
# An emptyDir here would silently discard the audit chain and the record of
# which events failed, on every pod restart. The container also runs with
# readOnlyRootFilesystem: true, so this is the ONLY writable path the
# application has for state.
# ReadWriteOnce is correct precisely because s43-api is a singleton (see the
# replica-safety note on the Deployment above); it is also why a second
# replica could not schedule even if someone set one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: s43-api-state
  namespace: sentinel43
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    # 256Mi was sized when this volume was believed to hold nothing. The
    # audit ledger has NO retention policy -- it is an append-only
    # hash-chained record and grows without bound -- so this is a runway,
    # not a limit that keeps it in check. The dead-letter store beside it IS
    # bounded (S43_DEAD_LETTER_MAX_ROWS). Monitor free space on this volume:
    # if it fills, audit writes fail, and an audit ledger that cannot be
    # written is a security control that has stopped working. Expanding it
    # later requires a StorageClass with allowVolumeExpansion: true.
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: s43-api
  namespace: sentinel43
  labels: {app: s43-api}
spec:
  type: ClusterIP
  selector: {app: s43-api}
  ports:
    - {port: 8000, targetPort: 8000, name: http}
