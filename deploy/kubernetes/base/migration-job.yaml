# Controlled, single-execution schema migration.
#
# Alembic is Sentinel-43's authoritative production schema mechanism.
# This Job is the only Kubernetes actor authorized to run:
#
#     alembic upgrade head
#
# IMPORTANT:
# Kubernetes does not make Deployments wait for Jobs merely because both
# resources are present in one Kustomization. Deployment automation must:
#
#   1. apply/run this migration Job,
#   2. wait for condition=complete,
#   3. only then apply or roll out the API Deployment.
#
# API workers must never perform production migrations. They may only verify
# schema readiness/version during startup/readiness checks.
#
# DATABASE_URL is supplied by sentinel43-secrets. alembic.ini must not contain
# credentials or a connection string.

apiVersion: batch/v1
kind: Job

metadata:
  name: s43-migration
  namespace: sentinel43
  labels:
    app: s43-migration

spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app: s43-migration
        network/s43-db-client: "true"

    spec:
      serviceAccountName: s43-migration
      automountServiceAccountToken: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 10

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: migrate
          image: sentinel43-api:base-placeholder
          imagePullPolicy: IfNotPresent

          command:
            - alembic
            - upgrade
            - head

          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"

          envFrom:
            - configMapRef:
                name: sentinel43-config
            - secretRef:
                name: sentinel43-secrets

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault

          volumeMounts:
            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: tmp
          emptyDir: {}

---
# Migration-specific database egress.
#
# DNS egress is intentionally not duplicated here. It is provided by the
# shared networkpolicy-dns.yaml policy in the Kubernetes base.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: s43-migration-egress
  namespace: sentinel43

spec:
  podSelector:
    matchLabels:
      app: s43-migration

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: s43-db

      ports:
        - protocol: TCP
          port: 5432
