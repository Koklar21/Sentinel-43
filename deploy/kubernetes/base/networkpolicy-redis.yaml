# Redis is not publicly exposed. Its Service is ClusterIP-only, and only
# pods explicitly labeled network/s43-redis-client: "true" may reach it on
# TCP 6379.
#
# Outbound traffic is restricted by the shared default-deny and DNS policies;
# this policy only defines Redis ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: s43-redis-allow-clients
  namespace: sentinel43

spec:
  podSelector:
    matchLabels:
      app: s43-redis

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              network/s43-redis-client: "true"
      ports:
        - protocol: TCP
          port: 6379
