apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sentinel43

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml

  - networkpolicy-default-deny.yaml
  - networkpolicy-dns.yaml
  - networkpolicy-api.yaml
  - networkpolicy-core.yaml
  - networkpolicy-db.yaml
  - networkpolicy-redis.yaml

  - postgres-statefulset.yaml
  - redis-statefulset.yaml

  - s43-core-deployment.yaml
  - s43-api-deployment.yaml
  - migration-job.yaml

# Secrets are provisioned separately at deploy time.
# See deploy/kubernetes/README.md.
images:
  - name: sentinel43-api
    newName: sentinel43-api
    newTag: base-placeholder
