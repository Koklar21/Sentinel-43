apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sentinel43

resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml

  - networkpolicy-default-deny.yaml
  - networkpolicy-dns.yaml
  - networkpolicy-api.yaml
  - networkpolicy-core.yaml
  - networkpolicy-db.yaml

  # No Redis. It was provisioned here for "forward compatibility" and
  # never used: nothing in core/ or dashboard/ opens a Redis connection,
  # docker-compose.yml runs no Redis service, and the StatefulSet named a
  # ServiceAccount (s43-redis) that this tree never defined, so its pods
  # could not have been admitted. An unused datastore in the namespace is
  # attack surface and a false capability signal, not readiness. The
  # firewall rate limiter that would justify it is in-process today (see
  # README "Known limitations"); making it shared is an application
  # change, and Redis comes back with it.
  - postgres-statefulset.yaml

  - s43-core-deployment.yaml
  - s43-api-deployment.yaml
  - migration-job.yaml

# Secrets are provisioned separately at deploy time.
# See deploy/kubernetes/README.md.
images:
  - name: sentinel43-api
    newName: sentinel43-api
    newTag: base-placeholder
