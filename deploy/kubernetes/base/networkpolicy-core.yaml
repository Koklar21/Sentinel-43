# s43-core accepts traffic only from pods explicitly labeled as core clients.
# Today that is s43-api, which reports internal monitoring/events to core.
#
# This policy grants core egress to PostgreSQL.
# DNS egress is provided separately by networkpolicy-dns.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: s43-core-allow-clients
  namespace: sentinel43

spec:
  podSelector:
    matchLabels:
      app: s43-core

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              network/s43-core-client: "true"
      ports:
        - protocol: TCP
          port: 9100

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: s43-db
      ports:
        - protocol: TCP
          port: 5432

