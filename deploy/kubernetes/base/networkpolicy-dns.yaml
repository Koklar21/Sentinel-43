# DNS egress for every pod in the namespace.
#
# The namespace-wide default-deny policy otherwise blocks service-name
# resolution. This policy allows UDP/TCP 53 only to pods in kube-system.
#
# Pod labels for cluster DNS vary across Kubernetes distributions, so the
# base policy avoids depending on a CoreDNS-specific label. This means any
# kube-system pod listening on port 53 is reachable; deployments with a
# stable DNS pod label may further restrict this in an overlay.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: allow-dns-egress
  namespace: sentinel43

spec:
  podSelector: {}

  policyTypes:
    - Egress

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

      ports:
        - protocol: UDP
          port: 53

        - protocol: TCP
          port: 53
