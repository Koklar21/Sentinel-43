# Postgres is not publicly exposed. Its Service is ClusterIP-only, and only
# pods explicitly labeled network/s43-db-client: "true" may reach it on TCP
# 5432.
#
# Outbound traffic is restricted by the shared default-deny and DNS policies;
# this policy only defines database ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: s43-db-allow-clients
  namespace: sentinel43

spec:
  podSelector:
    matchLabels:
      app: s43-db

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              network/s43-db-client: "true"
      ports:
        - protocol: TCP
          port: 5432
