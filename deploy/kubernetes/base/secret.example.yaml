# =============================================================================
# TEMPLATE ONLY — do not `kubectl apply -f` this file.
#
# It documents every key `sentinel43-secrets` must contain. It is
# deliberately NOT listed in kustomization.yaml's resources, so `kubectl
# apply -k` never applies it. Every value below is a placeholder string, not
# base64-encoded — there is nothing "usable" to decode here.
#
# Provide real secrets at deploy time instead, generated the same way
# docker-compose.yml documents (python -c "import secrets;
# print(secrets.token_urlsafe(32))" / scripts/generate_secrets.py), piped
# straight into kubectl and never written to a YAML file on disk. See
# deploy/kubernetes/README.md's "Secret provisioning" section for the exact
# command. Missing or empty required secrets must make the API fail to
# start (see core/api/main.py's _validate_security_config() /
# bootstrap_expectations()) — that fail-closed behavior is unchanged by
# Kubernetes and is exercised directly in this deployment's integration
# tests.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sentinel43-secrets
  namespace: sentinel43
type: Opaque
stringData:
  POSTGRES_PASSWORD: "CHANGEME_GENERATE_WITH_secrets.token_urlsafe(32)"
  REDIS_PASSWORD: "CHANGEME_GENERATE_WITH_secrets.token_urlsafe(32)"
  # Must match POSTGRES_PASSWORD above and the s43-db Service name (base
  # keeps the Service named s43-db so this needs no per-cluster rewriting).
  DATABASE_URL: "postgresql+asyncpg://s43:CHANGEME_SAME_AS_POSTGRES_PASSWORD@s43-db:5432/s43"
  # Must match REDIS_PASSWORD above.
  REDIS_URL: "redis://:CHANGEME_SAME_AS_REDIS_PASSWORD@s43-redis:6379/0"
  S43_JWT_SECRET: "CHANGEME_GENERATE_WITH_secrets.token_urlsafe(32)"
  # Generate with: python scripts/generate_secrets.py --password-hash
  S43_OPERATOR_PASSWORD_HASH: "CHANGEME_ARGON2_HASH"
  S43_AUTH_PEPPER: "CHANGEME_GENERATE_WITH_secrets.token_hex(32)"
  SENTINEL_LOG_SALT: "CHANGEME_GENERATE_WITH_secrets.token_hex(32)"
  # Only set the roles you actually need to grant /remote-gateway/* access.
  SENTINEL_REMOTE_TOKEN_OWNER: "CHANGEME_GENERATE_WITH_secrets.token_urlsafe(32)"
  SENTINEL_REMOTE_TOKEN_ADMIN: "CHANGEME_GENERATE_WITH_secrets.token_urlsafe(32)"
  SENTINEL_REMOTE_TOKEN_AUDITOR: "CHANGEME_GENERATE_WITH_secrets.token_urlsafe(32)"
  # Required for the Fenrir dashboard-broadcast path since
  # S43_FENRIR_ENABLED=true in configmap.yaml (see
  # docs/security/internal_service_auth.md — the route fails closed with 503
  # if this is unset, it does not silently disable auth).
  S43_FENRIR_API_TOKEN: "CHANGEME_GENERATE_WITH_secrets.token_urlsafe(32)"
