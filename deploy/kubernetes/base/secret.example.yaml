# =============================================================================
# TEMPLATE ONLY — DO NOT APPLY THIS FILE DIRECTLY.
#
# This manifest documents the secret keys required by the Sentinel-43
# Kubernetes deployment. Placeholder values are intentionally unusable.
#
# Real values must be generated outside version control and provisioned at
# deploy time. Do not commit rendered Secret manifests containing credentials.
#
# The application must fail closed when required secrets are absent.
# =============================================================================

apiVersion: v1
kind: Secret

metadata:
  name: sentinel43-secrets
  namespace: sentinel43

type: Opaque

stringData:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  POSTGRES_PASSWORD: "CHANGEME_GENERATE_RANDOM_SECRET"

  # Full connection URLs may be provisioned here if the application requires
  # DATABASE_URL directly. The password component must match POSTGRES_PASSWORD.
  DATABASE_URL: "postgresql+asyncpg://s43:CHANGEME@s43-db:5432/s43"

  # ---------------------------------------------------------------------------
  # Canonical Sentinel-43 authentication
  # ---------------------------------------------------------------------------
  S43_JWT_SECRET: "CHANGEME_GENERATE_RANDOM_SECRET"

  # Generate using the canonical Sentinel-43 password-hash tooling.
  S43_OPERATOR_PASSWORD_HASH: "CHANGEME_ARGON2ID_HASH"

  # Independent high-entropy pepper. Must not equal S43_JWT_SECRET.
  S43_AUTH_PEPPER: "CHANGEME_GENERATE_RANDOM_SECRET"

  # ---------------------------------------------------------------------------
  # Internal Watchtower service authentication
  # ---------------------------------------------------------------------------
  # Shared only by components explicitly authorized to call internal
  # Watchtower routes.
  S43_WATCHTOWER_SERVICE_TOKEN: "CHANGEME_GENERATE_RANDOM_SECRET"

  # ---------------------------------------------------------------------------
  # Fenrir service authentication
  # ---------------------------------------------------------------------------
  # FenrirHunter's own service identity, distinct from the Watchtower service
  # token above -- neither can authenticate as the other. Required because the
  # ConfigMap sets S43_FENRIR_ENABLED="true": without it the hunter reaches
  # HUNTING but the API bridge answers its reports 503 (unconfigured), so every
  # finding is dropped. The report URLs are non-secret and live in the
  # ConfigMap.
  S43_FENRIR_API_TOKEN: "CHANGEME_GENERATE_RANDOM_SECRET"

  # ---------------------------------------------------------------------------
  # Audit integrity
  # ---------------------------------------------------------------------------
  # HMAC key for the authoritative local audit chain.
  S43_AUDIT_HMAC_KEY: "CHANGEME_GENERATE_RANDOM_SECRET"

  # ---------------------------------------------------------------------------
  # Session integrity
  # ---------------------------------------------------------------------------
  # Stable secret used by the canonical session verifier/hash layer.
  S43_SESSION_HASH_PEPPER: "CHANGEME_GENERATE_RANDOM_SECRET"
