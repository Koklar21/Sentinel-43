# API ingress is intentionally not granted by the base.
# Environment overlays define their own ingress policy.
# Egress rules are additive with the shared DNS policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: s43-api-egress
  namespace: sentinel43

spec:
  podSelector:
    matchLabels:
      app: s43-api

  policyTypes:
    - Egress

  egress:
    - to:
        - podSelector:
            matchLabels:
              app: s43-db
      ports:
        - protocol: TCP
          port: 5432

    - to:
        - podSelector:
            matchLabels:
              app: s43-redis
      ports:
        - protocol: TCP
          port: 6379

    - to:
        - podSelector:
            matchLabels:
              app: s43-core
      ports:
        - protocol: TCP
          port: 9100
