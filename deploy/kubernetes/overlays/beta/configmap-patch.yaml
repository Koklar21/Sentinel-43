# CHANGEME: S43_TRUSTED_PROXIES must be the real ingress-nginx pod CIDR (or
# Service ClusterIP range, if you route through the Service instead of pod
# IPs) for YOUR cluster — pod CIDRs vary by cloud provider/CNI and cannot be
# guessed generically here. Find yours with, e.g.:
#   kubectl get pods -n ingress-nginx -o wide   # note the pod IPs' /16 or /24
#   kubectl cluster-info dump | grep -m1 cluster-cidr
# The value below is EMPTY, not a CHANGEME string, and that is deliberate:
# S43_TRUSTED_PROXIES is parsed as CIDRs, and a non-CIDR placeholder raises
# RuntimeError ("Invalid CIDR ...") rather than failing closed -- it would
# break every request, not just forwarded-header trust. Empty genuinely
# fails closed: no peer is a trusted proxy, X-Forwarded-For is never
# honoured, and every request is attributed to the ingress controller's own
# IP in the firewall, rate limiter and audit trail. That is safe but
# lossy -- set the real CIDR to recover true client IPs. See
# docs/security/trusted_proxy_handling.md.
#
# CHANGEME: S43_TRUSTED_HOSTS and S43_ALLOWED_ORIGINS must be your real
# public hostname.
#
# S43_TRUSTED_HOSTS: a ConfigMap patch REPLACES the key, it does not append
# to base's value -- so the in-cluster name "s43-api" must be repeated here.
# Dropping it does not merely lose a hostname: Fenrir reports its findings to
# http://s43-api:8000/..., those requests carry `Host: s43-api:8000`, and the
# TrustedHostGuard would answer them 400. The public host is what browsers
# and the Ingress send; both are needed.
# Leaving this unset is not an option outside a local environment -- the API
# refuses to start (this file previously claimed the app would answer on any
# Host with a warning; that has not been true since startup validation
# landed in core/api/main.py::_validate_security_config).
#
# S43_ALLOWED_ORIGINS: in a non-local environment the API refuses to start if
# this holds a plaintext (http://) non-loopback origin -- the ingress forces
# HTTPS, so every browser origin here must be https://.
#
# S43_TLS_TERMINATED_AT_TRUSTED_EDGE is "true" here, and only here, because
# this overlay is the thing that makes it true: ingress.yaml terminates TLS
# (cert-manager + ssl-redirect: "true") before traffic reaches the API. If
# you fork this overlay into one that serves plaintext, set it back to
# "false" and let startup fail rather than leaving the claim behind.
#
# S43_REJECT_LEGACY_AUTH: "true" here, stated explicitly. The per-request
# X-S43-Password fallback (for accounts with no DB-backed server session --
# break-glass/env-operator) is a compatibility path the real shipped
# consumers (browser dashboard's normal account path, dashboard Python
# clients, browser_tests/) never depend on for a real operator/admin
# account; only the break-glass path does, and that login is itself refused
# outside local/dev/test (so S43_OPERATOR_PASSWORD_HASH is not provisioned
# for this overlay). Outside local/dev/test the API
# refuses to start unless this is explicitly "true" -- unset, blank, "false"
# and malformed values all refuse (core/api/routers/auth.py::
# validate_legacy_auth_config) -- and refuses the fallback whatever the
# value. scripts/deploy_preflight.py also requires the explicit "true".
#
# S43_HEART_ENABLED: "true" here, and only here. The Heart
# (core/governance/heart.py::ThreatGovernor) is the human-governed
# threat-assessment staging pipeline: OBSERVE -> ASSESS -> DEDUPLICATE ->
# CORROBORATE -> STAGE -> WAIT FOR HUMAN DECISION. The code-level default
# stays false (core/api/main.py::_start_heart) so local dev and the
# existing test suite are unaffected -- this overlay is what turns it on
# for beta. It requires the authoritative audit store, which base's own
# non-local startup validation already makes mandatory regardless of this
# flag (core/api/main.py::_start_audit_store), so no additional secret is
# needed beyond what beta already requires. Required by default
# (S43_HEART_REQUIRED, code-level default true) once enabled: if it fails
# to start, /ready reports 503 rather than silently serving without
# human-governed staging. scripts/deploy_preflight.py's "prepare" mode
# fails a beta/non-local target that leaves this unset or not explicitly
# "true"; "verify" mode inspects the effective value inside the live pod.
#
# S43_GOVERNANCE_ENABLED: "true" with the Heart. Every Heart recommendation
# is staged and resolved by SystemOrchestrator (core/governance/
# orchestrator.py); the Heart has no decision authority of its own and
# fails to start -- blocking /ready -- without the orchestrator.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel43-config
  namespace: sentinel43
data:
  S43_TRUSTED_PROXIES: ""   # CHANGEME -> your ingress pod CIDR, e.g. "10.244.0.0/16"
  S43_TRUSTED_HOSTS: "beta.example.invalid,s43-api"     # CHANGEME -> <your real host>,s43-api
  S43_ALLOWED_ORIGINS: "https://beta.example.invalid"   # CHANGEME -> https://<your host>
  S43_TLS_TERMINATED_AT_TRUSTED_EDGE: "true"
  S43_REJECT_LEGACY_AUTH: "true"
  S43_HEART_ENABLED: "true"
  S43_HEART_REQUIRED: "true"
  S43_GOVERNANCE_ENABLED: "true"
  S43_GOVERNANCE_REQUIRED: "true"
