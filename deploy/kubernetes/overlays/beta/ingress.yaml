# Prerequisites (see deploy/kubernetes/README.md): ingress-nginx and
# cert-manager installed cluster-wide (neither is installed by this repo —
# they're documented operator prerequisites), plus a ClusterIssuer named
# "letsencrypt-prod" (or change the annotation below to match yours).
#
# CHANGEME: replace beta.example.invalid with your real public hostname
# before applying — example.invalid is deliberately non-resolvable
# (RFC 2606) so this manifest can't be mistaken for a working config.
#
# Only routes "/" (the whole s43-api Service, port 8000) — the same single
# FastAPI app docker-compose.yml exposes on host port 8000. Most
# admin/internal routes on it already require an operator JWT. /docs,
# /redoc, and /openapi.json are disabled by the application itself outside
# local/dev (core/api/main.py sets docs_url/redoc_url/openapi_url to None
# whenever SENTINEL_ENV is not a local/test value) -- this holds regardless
# of what this Ingress does, so no server-snippet/location-block workaround
# is needed here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s43-api
  namespace: sentinel43
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Ingress-nginx sets its own X-Forwarded-For based on the real client
    # connection; use-forwarded-headers here means it also respects an
    # upstream CDN/LB's X-Forwarded-For if you're behind one. Pairs with
    # S43_TRUSTED_PROXIES below — the app only trusts XFF from this
    # namespace's pod network in turn. See
    # docs/security/trusted_proxy_handling.md.
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"  # matches FirewallConfig.max_content_length_bytes default
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "75"   # > dashboard WS heartbeat (25s)
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    # HSTS at the edge (beta-execution Phase 2, F-TLS-1). ingress-nginx
    # enables HSTS by default; pin it explicitly so it survives a controller
    # ConfigMap that turned it off, and set a 180-day max-age.
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "15552000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    # Static hardening headers at the edge (the app also sets these via
    # SecurityHeadersMiddleware / SentinelFirewall — belt and braces, and
    # covers any response the app emits without them).
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "Referrer-Policy: no-referrer";
      more_set_headers "Strict-Transport-Security: max-age=15552000; includeSubDomains";
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["beta.example.invalid"]
      secretName: s43-api-tls
  rules:
    - host: beta.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s43-api
                port: {number: 8000}
