# Real beta sizing for s43-api: higher resource requests/limits than base's
# conservative defaults. Treat these numbers as a starting point, not a
# load-tested recommendation -- tune against your actual traffic.
#
# REPLICAS: this overlay previously set replicas: 2 with a podAntiAffinity
# spreading them across nodes. That was removed because it was wrong in two
# independent ways:
#
#   1. The application is single-replica-safe only. The idempotency ledger
#      (core/reliability.py) is an in-process dict, FenrirHunter and the
#      Sparta watchdog are started per API process, and dashboard WebSocket
#      clients are held per process. Two replicas means the same event is
#      processed twice, findings are produced twice, and a dashboard sees
#      only the events that happen to land on its own replica.
#   2. It could not have worked anyway: the base Deployment mounts the
#      ReadWriteOnce PVC s43-api-state, so a second pod on another node --
#      exactly what the anti-affinity asked for -- would sit Pending on
#      volume attach forever.
#
# Beta therefore inherits replicas: 1 from base. Scaling out is a real piece
# of work (shared idempotency store, shared broadcast bus, singleton election
# for the producers), not a manifest change. See the replica-safety note on
# base/s43-api-deployment.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s43-api
  namespace: sentinel43
spec:
  template:
    spec:
      containers:
        - name: s43-api
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: 1500m, memory: 768Mi}
