# Local dev only: enables the LOCAL_TEST_ENVIRONMENTS auth fallback path
# (core/api/main.py's _get_operator()) the same way .env.example's
# SENTINEL_ENV=development default does for docker-compose. Never applied
# in the beta overlay.
#
# S43_TRUSTED_HOSTS / S43_ALLOWED_ORIGINS: a ConfigMap patch REPLACES the
# base key, so the in-cluster name "s43-api" and loopback origins are repeated
# here. Machine-specific LAN addresses do not belong in the tracked dev
# overlay. For temporary LAN testing, add the host/IP and matching browser
# origin in an uncommitted local Kustomize patch.
#
# S43_WATCHTOWER_REQUIRED: "true" here (code-level default is "false").
# Beta Closure #2: with S43_WATCHTOWER_SERVICE_TOKEN missing from the
# Secret, s43-api's Watchtower registration/heartbeat calls to s43-core
# were rejected unauthenticated (401/503), the watchtower subsystem sat
# DEGRADED, and /ready still reported 200 -- an apparently healthy pod
# silently missing telemetry, discoverable only by reading logs. The
# token is provisioned now (from the same local secret source
# docker-compose already uses; see
# deploy/kubernetes/base/secret.example.yaml), but a future Secret
# rotation that drops it again must not repeat that silent failure. This
# flag is watchtower-specific and does not touch S43_GOVERNANCE_ENABLED/
# S43_HEART_ENABLED or their required-ness -- governance stays "false"
# here exactly as before.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sentinel43-config
  namespace: sentinel43
data:
  SENTINEL_ENV: "development"
  S43_ENV: "development"
  S43_TRUSTED_HOSTS: "s43-api"
  S43_ALLOWED_ORIGINS: "http://localhost:8000,http://127.0.0.1:8000"
  S43_WATCHTOWER_REQUIRED: "true"
