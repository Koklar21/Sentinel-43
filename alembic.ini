# =============================================================================
# Sentinel-43 — Alembic configuration (Pass 5A-Migration)
#
# Alembic is the authoritative production schema migration mechanism for the
# PostgreSQL database (the `users` table today, `sessions` as of 0002).
#
# There is NO connection string in this file. env.py reads DATABASE_URL from
# the environment — the same variable core/auth/users.py::_database_url()
# uses — so `alembic` is usable unchanged from isolated dev, CI, the Compose
# stack, and the Kubernetes migration Job (mission §4). Never add
# `sqlalchemy.url` here; never commit a DATABASE_URL value.
#
# Usage:
#   alembic upgrade head            # fresh DB: creates users then sessions
#   alembic stamp 0001_baseline     # existing pre-Alembic DB: adopt baseline
#                                    #   (env.py runs the compat check first)
#   alembic downgrade 0001_baseline # drops sessions (DESTROYS session state)
#   alembic heads                   # must always print exactly one head
# See MIGRATION_BASELINE_PASS5AM.md and MIGRATION_ARCHITECTURE_PASS5AM.md.
# =============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .
# Alembic 1.19+: `os` == os.pathsep for prepend_sys_path / version_locations.
path_separator = os
# Version files: NNNN_slug (zero-padded, lexically ordered). Single linear
# chain, exactly one head (enforced by test_migrations_pg.py).
truncate_slug_length = 40

# No sqlalchemy.url — see header. env.py supplies it from DATABASE_URL.

[post_write_hooks]
# none

# ---------------------------------------------------------------------------
# Logging. sqlalchemy.engine stays at WARN so a connection URL / SQL params
# are never echoed to logs (mission §4, §28). alembic at INFO for migration
# progress on stderr.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
