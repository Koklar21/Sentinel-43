<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sentinel-43 | Pending Actions Console</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#111a2e;
      --panel2:#0f172a;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --line:#23304a;
      --good:#22c55e;
      --warn:#f59e0b;
      --bad:#ef4444;
      --blue:#38bdf8;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background: radial-gradient(1200px 800px at 20% 0%, #16213a 0%, var(--bg) 60%);
      color:var(--text);
    }
    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      background: rgba(17,26,46,0.6);
      backdrop-filter: blur(6px);
      position:sticky;
      top:0;
      z-index:10;
    }
    .brand{ display:flex; gap:12px; align-items:center; }
    .brand h1{ margin:0; font-size:16px; letter-spacing:0.5px; }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border:1px solid var(--line);
      border-radius:999px;
      font-weight:800;
      font-size:12px;
      color:var(--text);
      background: rgba(15,23,42,0.65);
    }
    .dot{width:8px;height:8px;border-radius:50%}
    .dot.good{background:var(--good)}
    .dot.bad{background:var(--bad)}
    .dot.warn{background:var(--warn)}

    main{
      display:grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap:14px;
      padding:14px;
      max-width:1200px;
      margin:0 auto;
    }
    .card{
      background: rgba(17,26,46,0.65);
      border:1px solid var(--line);
      border-radius:14px;
      overflow:hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    .card .hd{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px;
      background: rgba(15,23,42,0.8);
      border-bottom:1px solid var(--line);
    }
    .card .hd h2{
      margin:0;
      font-size:13px;
      letter-spacing:0.4px;
      color:#d1d5db;
      text-transform:uppercase;
    }
    .card .bd{ padding:12px 14px; }

    .controls{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
    }
    .btn{
      border:1px solid var(--line);
      background: rgba(15,23,42,0.7);
      color: var(--text);
      padding:8px 10px;
      border-radius:10px;
      font-weight:800;
      font-size:12px;
      cursor:pointer;
      transition: border-color 120ms ease, background 120ms ease, transform 120ms ease;
    }
    .btn:hover{ border-color:#3b4a6b; }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{ opacity:0.55; cursor:not-allowed; transform:none; }

    .btn-approve{
      border-color: rgba(34,197,94,0.35);
      background: rgba(34,197,94,0.10);
    }
    .btn-veto{
      border-color: rgba(239,68,68,0.35);
      background: rgba(239,68,68,0.10);
    }
    .btn.active{
      border-color: rgba(56,189,248,0.55);
      background: rgba(56,189,248,0.12);
      color:#bae6fd;
    }

    .grid2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    .kv{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:10px 12px;
      border:1px solid var(--line);
      border-radius:12px;
      background: rgba(15,23,42,0.6);
    }
    .kv .k{ color:var(--muted); font-size:12px; font-weight:800; }
    .kv .v{ font-size:12px; font-weight:900; }

    .tag{
      display:inline-flex;
      align-items:center;
      padding:3px 8px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      border:1px solid var(--line);
      margin-left:8px;
      user-select:none;
    }
    .tag.active{ border-color: rgba(239,68,68,0.45); background: rgba(239,68,68,0.10); color:#fecaca;}
    .tag.gated{ border-color: rgba(56,189,248,0.45); background: rgba(56,189,248,0.10); color:#bae6fd;}
    .tag.shadow{ border-color: rgba(245,158,11,0.45); background: rgba(245,158,11,0.10); color:#fde68a;}
    .tag.done{ border-color: rgba(34,197,94,0.45); background: rgba(34,197,94,0.10); color:#bbf7d0;}

    .incident-row{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
      padding:12px 12px;
      border:1px solid var(--line);
      border-radius:14px;
      background: rgba(15,23,42,0.55);
      margin-bottom:10px;
    }
    .incident-details h4{ margin:0 0 6px 0; font-size:13px; }
    .incident-details p{
      margin:0;
      font-size:12px;
      color: var(--muted);
      line-height:1.4;
    }
    .action-area{
      display:flex;
      flex-direction:column;
      gap:8px;
      align-items:flex-end;
      min-width:140px;
    }
    .smallnote{
      font-size:12px;
      font-weight:900;
      color: var(--muted);
      text-transform:uppercase;
      letter-spacing:0.3px;
    }

    #log-console{
      height:420px;
      overflow:auto;
      padding:10px;
      border:1px solid var(--line);
      border-radius:14px;
      background: rgba(15,23,42,0.55);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size:12px;
    }
    .log-line{ padding:6px 6px; border-bottom:1px dashed rgba(35,48,74,0.65); color:#d1d5db; }
    .log-line.ok{ color:#bbf7d0; }
    .log-line.crit{ color:#fecaca; }
    .log-line.sim{ color:#fde68a; }

    /* Modal */
    .modal[hidden]{ display:none; }
    .modal{
      position:fixed; inset:0; z-index:999;
      display:grid; place-items:center;
    }
    .modal-backdrop{
      position:absolute; inset:0; background: rgba(0,0,0,.65);
    }
    .modal-card{
      position:relative;
      width: min(560px, calc(100vw - 28px));
      border-radius:16px;
      padding:18px;
      background: rgba(18, 22, 35, .92);
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .modal-card h3{ margin:0 0 6px 0; font-size:14px; letter-spacing:.2px; }
    .modal-card .muted{ margin:0 0 10px 0; color: var(--muted); font-size:12px; }
    .modal-card textarea{
      width:100%;
      padding:10px;
      border-radius:12px;
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.10);
      color: inherit;
      resize: vertical;
      outline:none;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.35;
    }
    .modal-card textarea:focus{ border-color: rgba(56,189,248,.45); box-shadow: 0 0 0 3px rgba(56,189,248,.10); }
    .modal-error{
      min-height:18px;
      margin-top:8px;
      color:#ff6b6b;
      font-size:12px;
    }
    .modal-actions{
      display:flex;
      justify-content:flex-end;
      gap:10px;
      margin-top:12px;
    }

    @media (max-width: 980px){
      main{ grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
<header>
  <div class="brand">
    <div style="width:10px;height:10px;border-radius:50%;background:#38bdf8;box-shadow:0 0 16px rgba(56,189,248,0.6)"></div>
    <h1>Sentinel-43 Pending Actions Console</h1>
    <span id="system-mode" class="pill">MODE: HUMAN GATED</span>
  </div>

  <div class="controls">
    <span class="pill"><span id="status-dot" class="dot warn"></span><span id="status-pill">Booting</span></span>
    <span class="pill">Queue: <span id="queue-count">0</span></span>

    <button id="refresh-now" class="btn" aria-label="Refresh pending actions">Refresh</button>
    <button id="inject-test" class="btn">Inject Test Action</button>
    <button id="set-token" class="btn">Set JWT</button>
  </div>
</header>

<main>
  <section class="card">
    <div class="hd">
      <h2>Pending / Staged Actions</h2>
      <div class="controls">
        <button class="btn" id="filter-pending">PENDING</button>
        <button class="btn" id="filter-staged">STAGED</button>
        <button class="btn" id="filter-all">ALL</button>
      </div>
    </div>
    <div class="bd">
      <div id="incident-feed"></div>
      <div id="empty-state" class="smallnote" style="display:none; padding:10px;">
        No actions. Which is either good… or the API is down.
      </div>
    </div>
  </section>

  <aside class="card">
    <div class="hd">
      <h2>Console</h2>
      <div class="controls">
        <button class="btn" id="clear-log">Clear</button>
      </div>
    </div>
    <div class="bd">
      <div class="grid2" style="margin-bottom:10px;">
        <div class="kv"><div class="k">API</div><div class="v" id="api-base">/api/v1</div></div>
        <div class="kv"><div class="k">Auth</div><div class="v" id="auth-state">Missing</div></div>
      </div>

      <div id="log-console" role="log" aria-live="polite" aria-atomic="false"></div>
    </div>
  </aside>
</main>

<!-- Decision Modal -->
<div id="decision-modal" class="modal" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="document">
    <h3 id="modal-title">Provide reason</h3>
    <p id="modal-subtitle" class="muted">Reason is required (10–500 chars). Ctrl+Enter confirms.</p>

    <textarea id="modal-input" rows="4" maxlength="500" placeholder="Type reason…"></textarea>
    <div id="modal-error" class="modal-error" aria-live="polite"></div>

    <div class="modal-actions">
      <button id="modal-cancel" class="btn">Cancel</button>
      <button id="modal-confirm" class="btn btn-approve">Confirm</button>
    </div>
  </div>
</div>

<script>
  // ============================================================
  // LIVE ONLY: Sentinel Pending Actions UI
  // Backend is authority. UI is just a nervous messenger.
  // ============================================================

  const MODES = {
    SHADOW: "SHADOW",
    ACTIVE: "ACTIVE",
    HUMAN_GATED: "HUMAN_GATED"
  };

  // Backend-supported statuses. If you add STAGED server-side, great.
  const VALID_STATUSES = new Set(["PENDING","STAGED","APPROVED","VETOED","EXPIRED","EXECUTED"]);

  const CONFIG = {
    API_BASE: "/api/v1",
    POLL_BASE_MS: 1500,
    MAX_FAILS: 5,
    LIST_LIMIT: 250,
    REASON_MIN: 10,
    REASON_MAX: 500,
    ENABLE_COOKIE_AUTH: true, // credentials:"include" on fetch (ready for httpOnly cookie)
    ALLOW_SHADOWED_FILTER: false // set true ONLY if backend actually supports SHADOWED
  };

  const feed = document.getElementById("incident-feed");
  const emptyState = document.getElementById("empty-state");
  const consoleLog = document.getElementById("log-console");
  const modeBadge = document.getElementById("system-mode");
  const queueCount = document.getElementById("queue-count");
  const statusPill = document.getElementById("status-pill");
  const statusDot = document.getElementById("status-dot");
  const authState = document.getElementById("auth-state");

  const refreshBtn = document.getElementById("refresh-now");
  const injectBtn = document.getElementById("inject-test");
  const setTokenBtn = document.getElementById("set-token");
  const clearLogBtn = document.getElementById("clear-log");

  const filterPendingBtn = document.getElementById("filter-pending");
  const filterStagedBtn  = document.getElementById("filter-staged");
  const filterAllBtn     = document.getElementById("filter-all");

  let FILTER = "ALL"; // ALL | PENDING | STAGED
  let refreshInFlight = false;
  let failCount = 0;
  let lastCount = -1;

  // Diff-render map: action_id -> { el, status }
  const rowMap = new Map();

  // ------------------------------------------------------------
  // API seam (real endpoints)
  // ------------------------------------------------------------
  const api = {
    token: () => sessionStorage.getItem("SENTINEL_JWT") || null,

    headers: () => {
      const h = { "Content-Type": "application/json" };
      const t = api.token();
      // Demo/prototype auth (XSS risk). Cookie auth is the real fix.
      if (t) h["Authorization"] = `Bearer ${t}`;
      return h;
    },

    async request(path, options = {}) {
      const r = await fetch(`${CONFIG.API_BASE}${path}`, {
        ...options,
        headers: { ...api.headers(), ...(options.headers || {}) },
        credentials: CONFIG.ENABLE_COOKIE_AUTH ? "include" : "same-origin"
      });
      if (!r.ok) {
        const txt = await safeText(r);
        throw new Error(`${path} failed (${r.status})${txt ? `: ${txt}` : ""}`);
      }
      const ct = r.headers.get("content-type") || "";
      if (ct.includes("application/json")) return r.json();
      return r.text();
    },

    health: () => api.request("/health"),

    listActionsByStatus: (statusFilter) =>
      api.request(`/actions?status_filter=${encodeURIComponent(statusFilter)}&limit=${CONFIG.LIST_LIMIT}`),

    approve: (actionId, reason) =>
      api.request(`/actions/${encodeURIComponent(actionId)}/approve`, {
        method: "POST",
        body: JSON.stringify({ reason })
      }),

    veto: (actionId, reason) =>
      api.request(`/actions/${encodeURIComponent(actionId)}/veto`, {
        method: "POST",
        body: JSON.stringify({ reason })
      }),

    inject: () => api.request("/actions", {
      method: "POST",
      body: JSON.stringify({
        action_type: "TEST_INCIDENT",
        payload: { ip: "203.0.113.88", threat: "Injected test action", source_ip: "203.0.113.88" }
      })
    })
  };

  async function safeText(r) {
    try { return (await r.text()).slice(0, 200); } catch { return ""; }
  }

  // ------------------------------------------------------------
  // UI helpers
  // ------------------------------------------------------------
  function nowTs() {
    return new Date().toLocaleTimeString("en-US", { hour12:false });
  }

  function addLog(msg, type = "") {
    const div = document.createElement("div");
    div.className = `log-line ${type}`;
    div.textContent = `[${nowTs()}] ${msg.startsWith("[") ? msg : `> ${msg}`}`;
    consoleLog.appendChild(div);
    consoleLog.scrollTop = consoleLog.scrollHeight;
  }

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function setActiveFilter(btn) {
    [filterPendingBtn, filterStagedBtn, filterAllBtn].forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  function setModeBadge(mode) {
    if (mode === MODES.SHADOW) {
      modeBadge.textContent = "MODE: SHADOW ADVISORY";
      modeBadge.style.background = "rgba(245,158,11,0.12)";
      modeBadge.style.borderColor = "rgba(245,158,11,0.35)";
      modeBadge.style.color = "#fde68a";
    } else if (mode === MODES.ACTIVE) {
      modeBadge.textContent = "MODE: ACTIVE DEFENSE";
      modeBadge.style.background = "rgba(239,68,68,0.12)";
      modeBadge.style.borderColor = "rgba(239,68,68,0.35)";
      modeBadge.style.color = "#fecaca";
    } else {
      modeBadge.textContent = "MODE: HUMAN GATED";
      modeBadge.style.background = "rgba(56,189,248,0.12)";
      modeBadge.style.borderColor = "rgba(56,189,248,0.35)";
      modeBadge.style.color = "#bae6fd";
    }
  }

  function setStatus(state) {
    statusPill.textContent = state;
    statusDot.classList.remove("good","bad","warn");
    if (state === "Online") statusDot.classList.add("good");
    else if (state === "Degraded" || state === "Syncing") statusDot.classList.add("warn");
    else statusDot.classList.add("bad");
  }

  function updateAuthState() {
    const t = api.token();
    authState.textContent = t ? "Present" : "Missing";
    authState.style.color = t ? "#bbf7d0" : "#fde68a";
  }

  function updateQueueCount(items) {
    const count = items.filter(x => x.status === "PENDING" || x.status === "STAGED").length;
    queueCount.textContent = String(count);
  }

  function rowTag(status) {
    // Keep it honest: don’t invent statuses your backend doesn’t have.
    if (status === "PENDING") return { cls:"active", label:"PENDING" };
    if (status === "STAGED") return { cls:"gated", label:"STAGED" };
    if (status === "APPROVED" || status === "EXECUTED") return { cls:"done", label:status };
    if (status === "VETOED") return { cls:"shadow", label:"VETOED" };
    if (status === "EXPIRED") return { cls:"shadow", label:"EXPIRED" };
    return { cls:"shadow", label:status || "UNKNOWN" };
  }

  function normalizeAction(a) {
    const createdMs = Date.parse(a.created_at);
    const payload = a.payload || {};
    const ip = payload.source_ip || payload.ip || "n/a";
    const threat = payload.threat || a.action_type || "ACTION";

    const status = (a.status || "UNKNOWN").toUpperCase();
    const safeStatus = VALID_STATUSES.has(status) ? status : "UNKNOWN";

    return {
      action_id: String(a.id || ""),
      ip,
      threat,
      created_at_ms: Number.isFinite(createdMs) ? createdMs : Date.now(),
      created_at_text: a.created_at || "",
      status: safeStatus,
      decision_reason: a.decision_reason || "",
      raw: a
    };
  }

  function renderIncidentRow(inc) {
    const row = document.createElement("div");
    row.className = "incident-row";
    row.dataset.actionId = inc.action_id;
    row.dataset.status = inc.status;

    const tag = rowTag(inc.status);
    const created = new Date(inc.created_at_ms).toLocaleString();

    const actionArea = document.createElement("div");
    actionArea.className = "action-area";

    if (inc.status === "PENDING") {
      const vetoBtn = document.createElement("button");
      vetoBtn.className = "btn btn-veto";
      vetoBtn.textContent = "VETO";
      vetoBtn.dataset.veto = inc.action_id;
      actionArea.appendChild(vetoBtn);
    } else if (inc.status === "STAGED") {
      const approveBtn = document.createElement("button");
      approveBtn.className = "btn btn-approve";
      approveBtn.textContent = "APPROVE";
      approveBtn.dataset.approve = inc.action_id;

      const vetoBtn = document.createElement("button");
      vetoBtn.className = "btn btn-veto";
      vetoBtn.textContent = "VETO";
      vetoBtn.dataset.veto = inc.action_id;

      actionArea.appendChild(approveBtn);
      actionArea.appendChild(vetoBtn);
    } else {
      const note = document.createElement("div");
      note.className = "smallnote";
      note.textContent = inc.status;
      actionArea.appendChild(note);
    }

    row.innerHTML = `
      <div class="incident-details">
        <h4>Threat: ${escapeHtml(inc.threat)} <span class="tag ${tag.cls}">${tag.label}</span></h4>
        <p>Source: ${escapeHtml(inc.ip)} | Created: ${escapeHtml(created)}</p>
        <p style="margin-top:6px;">Action ID: <span style="color:#cbd5e1">${escapeHtml(inc.action_id)}</span></p>
        ${inc.decision_reason ? `<p style="margin-top:6px;"><strong style="color:#e5e7eb;">Decision:</strong> ${escapeHtml(inc.decision_reason)}</p>` : ""}
      </div>
    `;
    row.appendChild(actionArea);
    return row;
  }

  function diffRender(items) {
    emptyState.style.display = items.length ? "none" : "block";
    updateQueueCount(items);

    const newIds = new Set(items.map(i => i.action_id));

    // Remove stale
    for (const [id, rec] of rowMap.entries()) {
      if (!newIds.has(id)) {
        rec.el.remove();
        rowMap.delete(id);
      }
    }

    // Insert/update in sorted order
    const frag = document.createDocumentFragment();

    for (const inc of items) {
      const existing = rowMap.get(inc.action_id);
      if (!existing) {
        const el = renderIncidentRow(inc);
        rowMap.set(inc.action_id, { el, status: inc.status });
        frag.appendChild(el);
      } else {
        // Update only when status or decision_reason changes
        const oldStatus = existing.el.dataset.status;
        const oldReason = existing.el.querySelector(".incident-details p strong") ? (existing.el.dataset.reason || "") : (existing.el.dataset.reason || "");
        const newReason = inc.decision_reason || "";

        if (oldStatus !== inc.status || oldReason !== newReason) {
          const el = renderIncidentRow(inc);
          rowMap.set(inc.action_id, { el, status: inc.status });
          existing.el.replaceWith(el);
        }
      }
    }

    // Rebuild order by re-attaching in the correct sequence (cheap + stable)
    feed.innerHTML = "";
    feed.appendChild(frag);
  }

  // ------------------------------------------------------------
  // Modal (no prompt garbage)
  // ------------------------------------------------------------
  function validateReason(reason) {
    const r = (reason || "").trim();
    if (!r) return "Reason is required.";
    if (r.length < CONFIG.REASON_MIN) return `Reason must be at least ${CONFIG.REASON_MIN} characters.`;
    if (r.length > CONFIG.REASON_MAX) return `Reason must be ${CONFIG.REASON_MAX} characters or less.`;
    if (/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/.test(r)) return "Reason contains invalid control characters.";
    return null;
  }

  function showDecisionModal({ title, subtitle, defaultText, confirmText, confirmClass }) {
    return new Promise((resolve) => {
      const modal = document.getElementById("decision-modal");
      const titleEl = document.getElementById("modal-title");
      const subEl = document.getElementById("modal-subtitle");
      const input = document.getElementById("modal-input");
      const errEl = document.getElementById("modal-error");
      const okBtn = document.getElementById("modal-confirm");
      const cancelBtn = document.getElementById("modal-cancel");
      const backdrop = modal.querySelector("[data-close]");

      let done = false;

      const cleanup = () => {
        okBtn.onclick = null;
        cancelBtn.onclick = null;
        backdrop.onclick = null;
        document.removeEventListener("keydown", onKey);
      };

      const close = (val) => {
        if (done) return;
        done = true;
        cleanup();
        modal.hidden = true;
        modal.setAttribute("aria-hidden", "true");
        errEl.textContent = "";
        resolve(val);
      };

      const onKey = (e) => {
        if (e.key === "Escape") close(null);
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) okBtn.click();
      };

      titleEl.textContent = title || "Provide reason";
      subEl.textContent = subtitle || `Reason is required (${CONFIG.REASON_MIN}–${CONFIG.REASON_MAX} chars). Ctrl+Enter confirms.`;
      input.value = defaultText || "";
      okBtn.textContent = confirmText || "Confirm";
      okBtn.className = `btn ${confirmClass || "btn-approve"}`;

      modal.hidden = false;
      modal.setAttribute("aria-hidden", "false");
      errEl.textContent = "";
      setTimeout(() => input.focus(), 0);

      backdrop.onclick = () => close(null);
      cancelBtn.onclick = () => close(null);

      okBtn.onclick = () => {
        const val = input.value;
        const error = validateReason(val);
        if (error) {
          errEl.textContent = error;
          return;
        }
        close(val.trim());
      };

      document.addEventListener("keydown", onKey);
    });
  }

  async function runButtonAction(btn, busyText, fn) {
    const oldText = btn.textContent;
    btn.disabled = true;
    btn.textContent = busyText;
    try {
      await fn();
    } finally {
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }

  // ------------------------------------------------------------
  // Actions (event delegation)
  // ------------------------------------------------------------
  feed.addEventListener("click", async (e) => {
    const vetoBtn = e.target.closest("[data-veto]");
    const approveBtn = e.target.closest("[data-approve]");

    if (vetoBtn) {
      const id = vetoBtn.dataset.veto;

      const reason = await showDecisionModal({
        title: `Veto ${id}`,
        subtitle: "Required. Explain why this action is being blocked.",
        defaultText: "Authorized traffic / false positive",
        confirmText: "Veto",
        confirmClass: "btn-veto"
      });

      if (!reason) {
        addLog(`[OVERSIGHT] VETO cancelled for ${id}.`, "sim");
        return;
      }

      await runButtonAction(vetoBtn, "PROCESSING…", async () => {
        await api.veto(id, reason);
        addLog(`[OVERSIGHT] VETOED ${id} | Reason: ${reason}`, "ok");
      });

      await refreshOnce(true);
      return;
    }

    if (approveBtn) {
      const id = approveBtn.dataset.approve;

      const reason = await showDecisionModal({
        title: `Approve ${id}`,
        subtitle: "Required. This may execute an irreversible action.",
        defaultText: "Approved by operator",
        confirmText: "Approve",
        confirmClass: "btn-approve"
      });

      if (!reason) {
        addLog(`[OVERSIGHT] APPROVE cancelled for ${id}.`, "sim");
        return;
      }

      await runButtonAction(approveBtn, "PROCESSING…", async () => {
        await api.approve(id, reason);
        addLog(`[OVERSIGHT] APPROVED ${id}`, "ok");
      });

      await refreshOnce(true);
      return;
    }
  });

  // ------------------------------------------------------------
  // Controls
  // ------------------------------------------------------------
  clearLogBtn.addEventListener("click", () => { consoleLog.innerHTML = ""; });

  setTokenBtn.addEventListener("click", () => {
    const cur = api.token() || "";
    const t = (prompt("Paste SENTINEL JWT (stored in sessionStorage). Leave blank to clear:", cur) || "").trim();
    if (!t) {
      sessionStorage.removeItem("SENTINEL_JWT");
      addLog("[CFG] JWT cleared.", "sim");
    } else {
      sessionStorage.setItem("SENTINEL_JWT", t);
      addLog("[CFG] JWT set. (Reminder: sessionStorage is not safe from XSS.)", "sim");
    }
    updateAuthState();
    refreshOnce(true);
  });

  injectBtn.addEventListener("click", async () => {
    try {
      injectBtn.disabled = true;
      injectBtn.textContent = "INJECTING…";
      await api.inject();
      addLog("[TEST] Injected test action.", "ok");
      await refreshOnce(true);
    } catch (err) {
      addLog(`[TEST] Inject failed: ${String(err)}`, "crit");
    } finally {
      injectBtn.disabled = false;
      injectBtn.textContent = "Inject Test Action";
    }
  });

  refreshBtn.addEventListener("click", async () => { await refreshOnce(true); });

  filterPendingBtn.addEventListener("click", async () => {
    FILTER = "PENDING";
    setActiveFilter(filterPendingBtn);
    addLog("[CFG] Filter: PENDING", "sim");
    await refreshOnce(true);
  });

  filterStagedBtn.addEventListener("click", async () => {
    FILTER = "STAGED";
    setActiveFilter(filterStagedBtn);
    addLog("[CFG] Filter: STAGED", "sim");
    await refreshOnce(true);
  });

  filterAllBtn.addEventListener("click", async () => {
    FILTER = "ALL";
    setActiveFilter(filterAllBtn);
    addLog("[CFG] Filter: ALL", "sim");
    await refreshOnce(true);
  });

  // Keyboard shortcut: "r" to refresh (unless typing in textarea/input)
  document.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
    if (tag === "input" || tag === "textarea") return;
    if (e.key === "r" && !e.ctrlKey && !e.metaKey) refreshBtn.click();
  });

  // ------------------------------------------------------------
  // Poll loop (safe + backoff)
  // ------------------------------------------------------------
  async function refreshOnce(logSyncing = false) {
    if (refreshInFlight) return;

    refreshInFlight = true;
    try {
      updateAuthState();
      setStatus(logSyncing ? "Syncing" : statusPill.textContent);

      // If your server later exposes /api/v1/mode, wire it here.
      setModeBadge(MODES.HUMAN_GATED);

      // Only request statuses your backend supports
      const wanted = (FILTER === "ALL")
        ? ["PENDING", "STAGED"]
        : [FILTER];

      // If you actually add SHADOWED server-side, flip the config.
      if (CONFIG.ALLOW_SHADOWED_FILTER && FILTER === "ALL") wanted.push("SHADOWED");

      const lists = await Promise.all(wanted.map(s => api.listActionsByStatus(s)));
      const raw = lists.flat();

      const normalized = raw
        .map(normalizeAction)
        .sort((a,b) => b.created_at_ms - a.created_at_ms);

      failCount = 0;
      setStatus("Online");

      diffRender(normalized);

      if (normalized.length !== lastCount) {
        addLog(`[UI] Loaded ${normalized.length} action(s).`, "ok");
        lastCount = normalized.length;
      }
    } catch (err) {
      failCount++;
      setStatus("Degraded");
      addLog(`[UI] Refresh failed (${failCount}/${CONFIG.MAX_FAILS}): ${String(err)}`, "crit");
      if (failCount >= CONFIG.MAX_FAILS) {
        setStatus("Offline");
        addLog("[UI] Auto-refresh stopped after repeated failures. Click Refresh to retry.", "crit");
        refreshInFlight = false;
        return;
      }
    } finally {
      refreshInFlight = false;
    }
  }

  async function refreshLoop() {
    // Do not overlap requests
    if (!refreshInFlight) await refreshOnce(false);

    // backoff schedule
    const delay = CONFIG.POLL_BASE_MS * Math.pow(2, Math.min(failCount, 4));

    if (failCount >= CONFIG.MAX_FAILS) return; // stopped
    setTimeout(refreshLoop, delay);
  }

  // Boot
  addLog("[SYS] Analyst Workstation Loaded (LIVE).", "ok");
  addLog("[CFG] No demo provider. API is required.", "sim");

  updateAuthState();
  setActiveFilter(filterAllBtn);
  refreshOnce(true);
  refreshLoop();
</script>
</body>
