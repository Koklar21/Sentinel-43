version: "3.9"

services:
  s43-core:
    build: .
    container_name: s43_core
    restart: unless-stopped
    command: python -m core.watchtower
    ports:
      - "9100:9100"
    environment:
      - S43_WATCHTOWER_HOST=0.0.0.0
      - S43_WATCHTOWER_PORT=9100
      - S43_ENV=production
      - S43_LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://s43:s43_password@s43-db:5432/s43
      - REDIS_URL=redis://s43-redis:6379/0
    volumes:
      - ./logs:/app/logs
    depends_on:
      - s43-db
      - s43-redis

  s43-api:
    build: .
    container_name: s43_api
    restart: unless-stopped
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - S43_ENV=production
      - S43_LOG_LEVEL=INFO
      - CORE_URL=http://s43-core:9100
      - DATABASE_URL=postgresql://s43:s43_password@s43-db:5432/s43
      - REDIS_URL=redis://s43-redis:6379/0
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - s43-core
      - s43-db
      - s43-redis

  s43-ui:
    build: ./ui
    container_name: s43_ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - s43-api

  s43-db:
    image: postgres:16
    container_name: s43_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: s43
      POSTGRES_USER: s43
      POSTGRES_PASSWORD: s43_password
    ports:
      - "5432:5432"
    volumes:
      - s43_pgdata:/var/lib/postgresql/data

  s43-redis:
    image: redis:7
    container_name: s43_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  s43_pgdata: