# =============================================================================
# Sentinel-43 — Docker Compose
#
# Local / single-host deployment.
#
# Production-like invariants:
#   - Postgres is the only database service in the base stack.
#   - Alembic is the only schema migration authority.
#   - s43-api does not start until migration completes successfully.
#   - s43-core is not host-published.
#   - s43-api is not host-published.
#   - s43-proxy is the only host-facing service.
#   - canonical configuration uses the S43_ namespace.
#   - canonical Sentinel-43 auth owns JWT/session identity.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  s43-db:
    image: postgres:16.3
    restart: unless-stopped

    environment:
      POSTGRES_DB: s43
      POSTGRES_USER: s43
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1'
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - s43_pgdata:/var/lib/postgresql/data

    networks:
      - s43_net


  # ---------------------------------------------------------------------------
  # Watchtower / core monitoring service
  # ---------------------------------------------------------------------------
  s43-core:
    build:
      context: .
      dockerfile: core/api/Dockerfile

    restart: unless-stopped

    command:
      - uvicorn
      - core.monitoring.watchtower:app
      - --host
      - 0.0.0.0
      - --port
      - "9100"

    environment:
      S43_ENV: ${S43_ENV:-production}
      SENTINEL_ENV: ${SENTINEL_ENV:-${S43_ENV:-production}}
      S43_LOG_LEVEL: ${S43_LOG_LEVEL:-INFO}

      S43_WATCHTOWER_HOST: 0.0.0.0
      S43_WATCHTOWER_PORT: "9100"
      S43_WATCHTOWER_SERVICE_TOKEN: ${S43_WATCHTOWER_SERVICE_TOKEN}

      # Watchtower operator-admin identity, distinct from the internal service
      # token above (X-S43-Admin-Token). Empty = unconfigured: the admin route
      # answers 503 rather than accepting anonymously.
      S43_ADMIN_TOKEN: ${S43_ADMIN_TOKEN:-}

      DATABASE_URL: ${DATABASE_URL}

      S43_AUDIT_HMAC_KEY: ${S43_AUDIT_HMAC_KEY:?S43_AUDIT_HMAC_KEY is required}
      S43_SESSION_HASH_PEPPER: ${S43_SESSION_HASH_PEPPER:?S43_SESSION_HASH_PEPPER is required}

    depends_on:
      s43-db:
        condition: service_healthy

    volumes:
      - sentinel43_state:/app/sentinel43_state

    networks:
      - s43_net


  # ---------------------------------------------------------------------------
  # Schema migration
  # ---------------------------------------------------------------------------
  s43-migrate:
    build:
      context: .
      dockerfile: core/api/Dockerfile

    command:
      - alembic
      - upgrade
      - head

    restart: "no"

    environment:
      S43_ENV: ${S43_ENV:-production}
      SENTINEL_ENV: ${SENTINEL_ENV:-${S43_ENV:-production}}
      S43_LOG_LEVEL: ${S43_LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      s43-db:
        condition: service_healthy

    networks:
      - s43_net


  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------
  s43-api:
    build:
      context: .
      dockerfile: core/api/Dockerfile

    restart: unless-stopped

    command:
      - uvicorn
      - core.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --forwarded-allow-ips
      - 127.0.0.1

    expose:
      - "8000"

    environment:
      # Runtime
      S43_ENV: ${S43_ENV:-production}
      SENTINEL_ENV: ${SENTINEL_ENV:-${S43_ENV:-production}}
      S43_LOG_LEVEL: ${S43_LOG_LEVEL:-INFO}

      # Transport / trusted proxy boundary
      S43_TRUSTED_PROXIES: ${S43_TRUSTED_PROXIES:-172.28.0.250/32}
      # s43-api is in this list because FenrirHunter reports its own findings
      # to S43_FENRIR_WATCHTOWER_URL / _BROADCAST_URL below, which resolve to
      # http://s43-api:8000 -- so those requests carry `Host: s43-api:8000`.
      # TrustedHostGuard does not exempt the event-ingress paths, so without
      # this entry the API answers its own detection node 400 and findings
      # are lost silently.
      S43_TRUSTED_HOSTS: ${S43_TRUSTED_HOSTS:-localhost,127.0.0.1,s43-api}
      S43_ALLOW_INSECURE_ORIGINS: ${S43_ALLOW_INSECURE_ORIGINS:-}
      # Operator assertion that HTTPS/WSS is terminated before the API (by
      # s43-proxy, in this stack). With S43_ENV=production the API refuses to
      # start without it -- and because Compose only passes variables that are
      # DECLARED here, setting it in .env alone would never reach the
      # container, leaving an operator with a startup error they cannot fix
      # from configuration.
      S43_TLS_TERMINATED_AT_TRUSTED_EDGE: ${S43_TLS_TERMINATED_AT_TRUSTED_EDGE:-}

      # Internal services
      S43_WATCHTOWER_URL: http://s43-core:9100
      S43_WATCHTOWER_SERVICE_TOKEN: ${S43_WATCHTOWER_SERVICE_TOKEN}
      S43_WATCHTOWER_TIMEOUT: ${S43_WATCHTOWER_TIMEOUT:-2.0}

      # Database
      DATABASE_URL: ${DATABASE_URL}
      S43_DB_PATH: /app/sentinel43_state/sentinel43.sqlite3
      # Stated explicitly rather than inherited from the container's working
      # directory, and identical to the Kubernetes ConfigMap. The audit
      # ledger must land on the sentinel43_state volume; anywhere else and
      # the authoritative record is discarded when the container is replaced.
      S43_AUDIT_SQLITE_PATH: ${S43_AUDIT_SQLITE_PATH:-/app/sentinel43_state/audit.sqlite3}

      # Canonical JWT authentication
      S43_JWT_SECRET: ${S43_JWT_SECRET}
      S43_JWT_ALGORITHM: ${S43_JWT_ALGORITHM:-HS256}
      S43_JWT_ISSUER: ${S43_JWT_ISSUER:-sentinel-43}
      S43_JWT_AUDIENCE: ${S43_JWT_AUDIENCE:-sentinel-43-dashboard}
      S43_JWT_TTL_SECONDS: ${S43_JWT_TTL_SECONDS:-28800}

      # Operator credentials
      S43_OPERATOR_USERNAME: ${S43_OPERATOR_USERNAME:-operator}
      S43_OPERATOR_PASSWORD_HASH: ${S43_OPERATOR_PASSWORD_HASH}

      # Auth/session integrity
      S43_AUTH_PEPPER: ${S43_AUTH_PEPPER}
      S43_SESSION_HASH_PEPPER: ${S43_SESSION_HASH_PEPPER:?S43_SESSION_HASH_PEPPER is required}
      S43_SESSION_ACCESS_TTL_SECONDS: ${S43_SESSION_ACCESS_TTL_SECONDS:-900}
      S43_SESSION_REFRESH_TTL_SECONDS: ${S43_SESSION_REFRESH_TTL_SECONDS:-604800}
      S43_WS_SESSION_RECHECK_SECONDS: ${S43_WS_SESSION_RECHECK_SECONDS:-60}

      # WebSocket auth
      S43_WS_REQUIRE_AUTH: ${S43_WS_REQUIRE_AUTH:-true}

      # CORS
      S43_ALLOWED_ORIGINS: ${S43_ALLOWED_ORIGINS}

      # Governance
      S43_GOVERNANCE_ENABLED: ${S43_GOVERNANCE_ENABLED:-false}
      S43_DEFAULT_MODE: ${S43_DEFAULT_MODE:-HUMAN_GATED}

      # Fenrir
      S43_FENRIR_ENABLED: ${S43_FENRIR_ENABLED:-true}
      S43_FENRIR_NODE_ID: ${S43_FENRIR_NODE_ID:-sentinel-43-primary}
      S43_FENRIR_MIN_SEVERITY: ${S43_FENRIR_MIN_SEVERITY:-MEDIUM}
      S43_FENRIR_ANOMALY_ZSCORE: ${S43_FENRIR_ANOMALY_ZSCORE:-2.5}
      S43_FENRIR_ANOMALY_DECAY: ${S43_FENRIR_ANOMALY_DECAY:-0.002}
      S43_FENRIR_MAX_HONEYPOT_EVENTS: ${S43_FENRIR_MAX_HONEYPOT_EVENTS:-500}

      # FenrirHunter runs embedded in this container and reports back through
      # the API bridge under its OWN service identity (never the Watchtower
      # service token). Without these it reaches HUNTING but has no report
      # target and no credential, so every finding is dropped.
      # Empty token = unconfigured: /internal/events/broadcast and
      # /watchtower/events answer 503 rather than accepting anonymously.
      S43_FENRIR_API_TOKEN: ${S43_FENRIR_API_TOKEN:-}
      S43_FENRIR_WATCHTOWER_URL: ${S43_FENRIR_WATCHTOWER_URL:-http://s43-api:8000/watchtower/events}
      S43_FENRIR_BROADCAST_URL: ${S43_FENRIR_BROADCAST_URL:-http://s43-api:8000/internal/events/broadcast}
      S43_FENRIR_REPORT_TIMEOUT: ${S43_FENRIR_REPORT_TIMEOUT:-2.0}

      # Event delivery reliability (idempotency, bounded retry, dead-letter).
      # Undeclared variables never reach the container, so the tunables the
      # reliability layer reads are declared here or they are inert.
      # Defaults are the in-code defaults; empty means "use the default".
      S43_DEAD_LETTER_PATH: ${S43_DEAD_LETTER_PATH:-/app/sentinel43_state/dead_letter.sqlite3}
      S43_DEAD_LETTER_MAX_ROWS: ${S43_DEAD_LETTER_MAX_ROWS:-10000}
      S43_IDEMPOTENCY_MAX_ENTRIES: ${S43_IDEMPOTENCY_MAX_ENTRIES:-10000}
      S43_IDEMPOTENCY_TTL_SECONDS: ${S43_IDEMPOTENCY_TTL_SECONDS:-900}
      S43_DELIVERY_MAX_ATTEMPTS: ${S43_DELIVERY_MAX_ATTEMPTS:-3}
      S43_DELIVERY_BASE_DELAY: ${S43_DELIVERY_BASE_DELAY:-0.2}
      S43_DELIVERY_MAX_DELAY: ${S43_DELIVERY_MAX_DELAY:-5.0}
      S43_DELIVERY_DEADLINE: ${S43_DELIVERY_DEADLINE:-10.0}

      # Optional observational subsystems
      S43_SPARTA_ENABLED: ${S43_SPARTA_ENABLED:-false}
      S43_JORM_ENABLED: ${S43_JORM_ENABLED:-false}

      # SpartaCore integrity watchdog + /node router.
      # Only consulted when S43_SPARTA_ENABLED=true; an empty node token keeps
      # the /node routes fail-closed (503) instead of serving anonymously.
      S43_SPARTA_NODE_TOKEN: ${S43_SPARTA_NODE_TOKEN:-}
      S43_SPARTA_TOKEN_SECRET: ${S43_SPARTA_TOKEN_SECRET:-}
      S43_SPARTA_NODE_SIGNATURE: ${S43_SPARTA_NODE_SIGNATURE:-sparta-core}
      S43_SPARTA_PUBLIC_HEALTH_DETAIL: ${S43_SPARTA_PUBLIC_HEALTH_DETAIL:-false}
      S43_SPARTA_CHECK_INTERVAL: ${S43_SPARTA_CHECK_INTERVAL:-30.0}

      # Watched-file digests. main.py scans os.environ for the
      # S43_SPARTA_HASH_ prefix, so these are declared value-less: Compose then
      # passes each through ONLY when it is set on the host and omits it
      # otherwise. Do not give these a "${VAR:-}" default -- an empty digest
      # is not skipped, it fails IntegrityConfig validation at startup.
      #
      # Key -> path: the suffix is lowercased and EVERY "_" becomes "/", so
      # write the file extension with a literal dot:
      #     …_CORE_API_MAIN.PY  ->  core/api/main.py
      # Because every underscore becomes a separator, a path whose directory
      # or file name itself contains "_" cannot be expressed this way
      # (…_SPARTA_CORE.PY resolves to core/monitoring/sparta/core.py, not
      # sparta_core.py). The three slots below are underscore-free on purpose:
      # the composition root, the Watchtower node, and the audit authority.
      S43_SPARTA_HASH_CORE_API_MAIN.PY:
      S43_SPARTA_HASH_CORE_MONITORING_WATCHTOWER.PY:
      S43_SPARTA_HASH_CORE_AUDIT_STORE.PY:

      # Local-only test hook. Production bootstrap must reject true.
      S43_ENABLE_TEST_INJECTION: ${S43_ENABLE_TEST_INJECTION:-false}

      # Audit authority
      S43_AUDIT_HMAC_KEY: ${S43_AUDIT_HMAC_KEY:?S43_AUDIT_HMAC_KEY is required}

    volumes:
      - sentinel43_state:/app/sentinel43_state

    depends_on:
      s43-migrate:
        condition: service_completed_successfully

      s43-core:
        condition: service_started

      s43-db:
        condition: service_healthy

    networks:
      - s43_net

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ---------------------------------------------------------------------------
  # Reverse proxy / TLS terminator
  # ---------------------------------------------------------------------------
  s43-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./deploy/proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/proxy/certs:/etc/nginx/certs:ro

    depends_on:
      s43-api:
        condition: service_healthy

    networks:
      s43_net:
        ipv4_address: 172.28.0.250


  # ---------------------------------------------------------------------------
  # Setup / secret generation
  # ---------------------------------------------------------------------------
  s43-setup:
    build:
      context: .
      dockerfile: core/api/Dockerfile

    entrypoint:
      - python
      - core/scripts/generate_secrets.py

    command: []

    volumes:
      - type: bind
        source: .
        target: /app

    profiles:
      - setup

    environment:
      S43_ENV: development

    network_mode: none
    restart: "no"


volumes:
  s43_pgdata:
  sentinel43_state:


networks:
  s43_net:
    driver: bridge

    ipam:
      config:
        - subnet: 172.28.0.0/24
