# =============================================================================
# Sentinel-43 — Docker Compose
#
# Required .env variables:
#   POSTGRES_PASSWORD       strong random password for Postgres
#   REDIS_PASSWORD          strong random password for Redis
#   DATABASE_URL            postgresql+asyncpg://s43:<POSTGRES_PASSWORD>@s43-db:5432/s43
#
# For production, also set in .env:
#   SENTINEL_ENV            production
#   S43_JWT_SECRET          output of: python -c "import secrets; print(secrets.token_urlsafe(32))"
#   S43_JWT_ALGORITHM       HS256
#   S43_JWT_ISSUER          sentinel-43
#   S43_JWT_AUDIENCE        sentinel-43-dashboard
#   S43_WS_REQUIRE_AUTH     true
#   S43_ALLOWED_ORIGINS     https://yourdomain.com
#   S43_ENABLE_TEST_INJECTION  false  (or omit entirely)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Postgres
  # ---------------------------------------------------------------------------
  s43-db:
    image: postgres:16.3
    container_name: s43_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       s43
      POSTGRES_USER:     s43
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s43 -d s43"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - s43_pgdata:/var/lib/postgresql/data
    networks:
      - s43_net

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  s43-redis:
    image: redis:7.2
    container_name: s43_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - s43_net

  # ---------------------------------------------------------------------------
  # Watchtower (core monitoring node)
  # ---------------------------------------------------------------------------
  s43-core:
    build:
      context: .
      dockerfile: core/api/Dockerfile
    container_name: s43_core
    restart: unless-stopped
    command: python -m core.monitoring.watchtower
    ports:
      - "9100:9100"
    environment:
      S43_WATCHTOWER_HOST: 0.0.0.0
      S43_WATCHTOWER_PORT: 9100
      SENTINEL_ENV:        ${SENTINEL_ENV:-development}
      S43_LOG_LEVEL:       INFO
      DATABASE_URL:        ${DATABASE_URL}
      REDIS_URL:           redis://:${REDIS_PASSWORD}@s43-redis:6379/0
    volumes:
      - ./logs:/app/logs
    depends_on:
      s43-db:
        condition: service_healthy
      s43-redis:
        condition: service_healthy
    networks:
      - s43_net

  # ---------------------------------------------------------------------------
  # API (FastAPI)
  # ---------------------------------------------------------------------------
  s43-api:
    build:
      context: .
      dockerfile: core/api/Dockerfile
    container_name: s43_api
    restart: unless-stopped
    command: uvicorn core.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      # --- Runtime environment -------------------------------------------
      SENTINEL_ENV:              ${SENTINEL_ENV:-development}
      S43_LOG_LEVEL:             INFO

      # --- Service endpoints ---------------------------------------------
      S43_WATCHTOWER_URL:        http://s43-core:9100
      DATABASE_URL:              ${DATABASE_URL}
      REDIS_URL:                 redis://:${REDIS_PASSWORD}@s43-redis:6379/0

      # --- JWT authentication -------------------------------------------
      # In development these can be empty — bootstrap_expectations() only
      # enforces them when SENTINEL_ENV is not in LOCAL_TEST_ENVIRONMENTS.
      # In production all four must be set in .env before starting.
      S43_JWT_SECRET:            ${S43_JWT_SECRET:-}
      S43_JWT_ALGORITHM:         ${S43_JWT_ALGORITHM:-HS256}
      S43_JWT_ISSUER:            ${S43_JWT_ISSUER:-sentinel-43}
      S43_JWT_AUDIENCE:          ${S43_JWT_AUDIENCE:-sentinel-43-dashboard}

      # --- WebSocket auth -----------------------------------------------
      # Set to true in production. False is acceptable for local dev.
      S43_WS_REQUIRE_AUTH:       ${S43_WS_REQUIRE_AUTH:-false}

      # --- CORS origins -------------------------------------------------
      # FIX: was CORS_ORIGINS — main.py reads S43_ALLOWED_ORIGINS.
      # Dev default covers Live Server on port 5500.
      # Production: set S43_ALLOWED_ORIGINS=https://yourdomain.com in .env
      S43_ALLOWED_ORIGINS:       ${S43_ALLOWED_ORIGINS:-http://localhost:5500,http://127.0.0.1:5500,http://localhost:8000,http://127.0.0.1:8000}

      # --- Test injection -----------------------------------------------
      # Never set to true in production.
      S43_ENABLE_TEST_INJECTION: ${S43_ENABLE_TEST_INJECTION:-false}

      # --- Storage paths ------------------------------------------------
      SENTINEL43_DATA_DIR:       /app/sentinel43_state
      SENTINEL43_DB_PATH:        /app/sentinel43_state/sentinel43.sqlite3

    volumes:
      - sentinel43_state:/app/sentinel43_state
      - ./logs:/app/logs
    depends_on:
      s43-core:
        condition: service_started
      s43-db:
        condition: service_healthy
      s43-redis:
        condition: service_healthy
    networks:
      - s43_net

# -----------------------------------------------------------------------------
# Volumes and Networks
# -----------------------------------------------------------------------------
volumes:
  s43_pgdata:
  sentinel43_state:

networks:
  s43_net:
    driver: bridge
