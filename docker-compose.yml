# =============================================================================
# Sentinel-43 — Docker Compose
#
# Required .env variables
# -----------------------
# Infrastructure:
#   POSTGRES_PASSWORD          strong random password for Postgres
#   REDIS_PASSWORD             strong random password for Redis
#   DATABASE_URL               postgresql+asyncpg://s43:<POSTGRES_PASSWORD>@s43-db:5432/s43
#
# Auth / JWT:
#   S43_JWT_SECRET             output of: python -c "import secrets; print(secrets.token_urlsafe(32))"
#   S43_JWT_ALGORITHM          HS256
#   S43_JWT_ISSUER             sentinel-43
#   S43_JWT_AUDIENCE           sentinel-43-dashboard
#   S43_AUTH_PEPPER            output of: python -c "import secrets; print(secrets.token_hex(32))"
#   S43_WS_REQUIRE_AUTH        true
#   S43_OPERATOR_USERNAME      operator  (or your chosen username)
#   S43_OPERATOR_PASSWORD_HASH output of: python scripts/generate_secrets.py --password-hash
#
# Internal service auth:
#   S43_WATCHTOWER_SERVICE_TOKEN  output of: python -c "import secrets; print(secrets.token_urlsafe(32))"
#                                 shared by s43-api and s43-core; the Watchtower
#                                 rejects every non-probe route without it
#
# Log pseudonymization:
#   SENTINEL_LOG_SALT          output of: python -c "import secrets; print(secrets.token_hex(32))"
#
# Remote gateway:
#   SENTINEL_REMOTE_TOKEN_OWNER    output of: python -c "import secrets; print(secrets.token_urlsafe(32))"
#   SENTINEL_REMOTE_TOKEN_ADMIN    (same)
#   SENTINEL_REMOTE_TOKEN_AUDITOR  (same)
#
# Fenrir (required when S43_FENRIR_ENABLED=true):
#   S43_FENRIR_API_TOKEN       output of: python -c "import secrets; print(secrets.token_urlsafe(32))"
#
# Generate all of the above in one step:
#   python scripts/generate_secrets.py --write .env
#   python scripts/generate_secrets.py --password-hash   (then paste the output into .env)
#
# Or via Docker (no Python required on host):
#   docker compose --profile setup run --rm s43-setup --write /app/.env
#
# Production — also set in .env:
#   SENTINEL_ENV               production
#   S43_ALLOWED_ORIGINS        https://yourdomain.com
#   S43_ENABLE_TEST_INJECTION  false  (or omit entirely)
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Postgres
  # ---------------------------------------------------------------------------
  s43-db:
    image: postgres:16.3
    container_name: s43_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       s43
      POSTGRES_USER:     s43
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s43 -d s43"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - s43_pgdata:/var/lib/postgresql/data
    networks:
      - s43_net

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  s43-redis:
    image: redis:7.2
    container_name: s43_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - s43_net

  # ---------------------------------------------------------------------------
  # Watchtower (core monitoring node)
  # Runs the same image as s43-api but with the Watchtower entrypoint.
  # ---------------------------------------------------------------------------
  s43-core:
    build:
      context: .
      dockerfile: core/api/Dockerfile
    container_name: s43_core
    restart: unless-stopped
    command: uvicorn core.monitoring.watchtower:app --host 0.0.0.0 --port 9100
    # No host port publication (Pass 1 — direct Watchtower exposure).
    # Only s43-api needs to reach the Watchtower, and it does so over the
    # s43_net bridge at http://s43-core:9100. This matches the Kubernetes
    # posture, where the s43-core Service is ClusterIP with a NetworkPolicy
    # that only admits s43-api. To reach it from the host for local
    # debugging, add a docker-compose.override.yml with:
    #   services: {s43-core: {ports: ["127.0.0.1:9100:9100"]}}
    # and remember every operational route now needs
    # `Authorization: Bearer $S43_WATCHTOWER_SERVICE_TOKEN`.
    environment:
      # --- Runtime ---
      SENTINEL_ENV:       ${SENTINEL_ENV}
      S43_LOG_LEVEL:      INFO

      # --- Watchtower bind ---
      S43_WATCHTOWER_HOST:    0.0.0.0
      S43_WATCHTOWER_PORT:    9100
      S43_EXPOSE_BIND_HOST:   "true"

      # --- Storage ---
      DATABASE_URL:       ${DATABASE_URL}
      REDIS_URL:          redis://:${REDIS_PASSWORD}@s43-redis:6379/0

      # --- Hardening ---
      S43_AUTH_PEPPER:                ${S43_AUTH_PEPPER}
      SENTINEL_LOG_SALT:              ${SENTINEL_LOG_SALT}
      # Internal-service token the Watchtower requires on every operational
      # and mutation route (/status, /modules*, /dependencies*,
      # /events/recent, /analyze, /state/*). /watchtower/health and
      # /watchtower/ready stay open for probes. Must match s43-api's value.
      S43_WATCHTOWER_SERVICE_TOKEN:   ${S43_WATCHTOWER_SERVICE_TOKEN}
    volumes:
      - ./logs:/app/logs
    depends_on:
      s43-db:
        condition: service_healthy
      s43-redis:
        condition: service_healthy
    networks:
      - s43_net

  # ---------------------------------------------------------------------------
  # API (FastAPI)
  # ---------------------------------------------------------------------------
  s43-api:
    build:
      context: .
      dockerfile: core/api/Dockerfile
    container_name: s43_api
    restart: unless-stopped
    # --forwarded-allow-ips pins uvicorn's own default (127.0.0.1) so a
    # FORWARDED_ALLOW_IPS=* env can't make uvicorn rewrite the client IP from
    # X-Forwarded-For for any peer and bypass SentinelFirewall. The real
    # proxy-trust knob is S43_TRUSTED_PROXIES. See
    # docs/security/trusted_proxy_handling.md.
    command: uvicorn core.api.main:app --host 0.0.0.0 --port 8000 --forwarded-allow-ips 127.0.0.1
    ports:
      - "8000:8000"
    environment:
      # --- Runtime environment ---
      SENTINEL_ENV:              ${SENTINEL_ENV}
      S43_ENV:                   ${SENTINEL_ENV}
      S43_LOG_LEVEL:             INFO

      # --- Service endpoints ---
      S43_WATCHTOWER_URL:        http://s43-core:9100
      # Must match s43-core's value — the API presents this on every
      # service-to-service call to the Watchtower (Pass 1).
      S43_WATCHTOWER_SERVICE_TOKEN: ${S43_WATCHTOWER_SERVICE_TOKEN}
      DATABASE_URL:              ${DATABASE_URL}
      REDIS_URL:                 redis://:${REDIS_PASSWORD}@s43-redis:6379/0

      # --- JWT authentication ---
      S43_JWT_SECRET:            ${S43_JWT_SECRET}
      S43_JWT_ALGORITHM:         ${S43_JWT_ALGORITHM:-HS256}
      S43_JWT_ISSUER:            ${S43_JWT_ISSUER:-sentinel-43}
      S43_JWT_AUDIENCE:          ${S43_JWT_AUDIENCE:-sentinel-43-dashboard}
      S43_JWT_TTL_SECONDS:       ${S43_JWT_TTL_SECONDS:-28800}

      # --- Operator credentials ---
      S43_OPERATOR_USERNAME:     ${S43_OPERATOR_USERNAME:-operator}
      S43_OPERATOR_PASSWORD_HASH: ${S43_OPERATOR_PASSWORD_HASH}

      # --- Auth key-store hardening ---
      S43_AUTH_PEPPER:           ${S43_AUTH_PEPPER}

      # --- Log pseudonymization ---
      SENTINEL_LOG_SALT:         ${SENTINEL_LOG_SALT}

      # --- WebSocket auth ---
      S43_WS_REQUIRE_AUTH:       ${S43_WS_REQUIRE_AUTH:-true}

      # --- CORS ---
      S43_ALLOWED_ORIGINS:       ${S43_ALLOWED_ORIGINS}

      # --- Remote gateway operator tokens ---
      SENTINEL_REMOTE_TOKEN_OWNER:    ${SENTINEL_REMOTE_TOKEN_OWNER}
      SENTINEL_REMOTE_TOKEN_ADMIN:    ${SENTINEL_REMOTE_TOKEN_ADMIN}
      SENTINEL_REMOTE_TOKEN_AUDITOR:  ${SENTINEL_REMOTE_TOKEN_AUDITOR}

      # --- Fenrir threat detection ---
      S43_FENRIR_ENABLED:            ${S43_FENRIR_ENABLED:-true}
      SENTINEL_FENRIR_ENABLED:       ${SENTINEL_FENRIR_ENABLED:-true}
      FENRIR_ENABLED:                ${FENRIR_ENABLED:-true}
      S43_FENRIR_NODE_ID:            ${S43_FENRIR_NODE_ID:-sentinel-43-primary}
      S43_FENRIR_MIN_SEVERITY:       ${S43_FENRIR_MIN_SEVERITY:-MEDIUM}
      S43_FENRIR_ANOMALY_ZSCORE:     ${S43_FENRIR_ANOMALY_ZSCORE:-2.5}
      S43_FENRIR_ANOMALY_DECAY:      ${S43_FENRIR_ANOMALY_DECAY:-0.002}
      S43_FENRIR_MAX_HONEYPOT_EVENTS: ${S43_FENRIR_MAX_HONEYPOT_EVENTS:-500}
      # Fenrir reports findings through the API bridge, which authenticates
      # them with the Fenrir service token and forwards to the Watchtower's
      # /watchtower/analyze. It is NOT s43-core:9100/watchtower/events —
      # that route has never existed on the Watchtower service (F-06).
      S43_FENRIR_WATCHTOWER_URL:     http://s43-api:8000/watchtower/events
      S43_FENRIR_BROADCAST_URL:      http://s43-api:8000/internal/events/broadcast
      S43_FENRIR_REPORT_TIMEOUT:     ${S43_FENRIR_REPORT_TIMEOUT:-2.0}
      S43_FENRIR_API_TOKEN:          ${S43_FENRIR_API_TOKEN}

      # --- Feature flags ---
      S43_ENABLE_TEST_INJECTION: ${S43_ENABLE_TEST_INJECTION:-false}
      S43_GOVERNANCE_ENABLED:    ${S43_GOVERNANCE_ENABLED:-false}
      S43_SPARTA_ENABLED:        ${S43_SPARTA_ENABLED:-false}
      S43_JORM_ENABLED:          ${S43_JORM_ENABLED:-false}

      # --- Persistent state ---
      # Fix: was SENTINEL43_DB_PATH (not read by the app).
      # core/cli code reads SENTINEL_DB_PATH via _env("SENTINEL_DB_PATH", ...).
      SENTINEL_DB_PATH:          /app/sentinel43_state/sentinel43.sqlite3

    volumes:
      - sentinel43_state:/app/sentinel43_state
      - ./logs:/app/logs
    depends_on:
      s43-core:
        condition: service_started
      s43-db:
        condition: service_healthy
      s43-redis:
        condition: service_healthy
    networks:
      - s43_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Setup (one-shot secret generator)
  #
  # Runs only when the "setup" profile is requested.
  # Never starts during a normal `docker compose up`.
  #
  # Usage:
  #   Print secrets to stdout (review before writing):
  #     docker compose --profile setup run --rm s43-setup
  #
  #   Write missing secrets to .env:
  #     docker compose --profile setup run --rm s43-setup --write /app/.env
  #
  #   Rotate all generated secrets:
  #     docker compose --profile setup run --rm s43-setup --write /app/.env --force
  #
  #   Validate .env for missing or placeholder values:
  #     docker compose --profile setup run --rm s43-setup --check /app/.env
  #
  #   Generate operator password hash interactively:
  #     docker compose --profile setup run --rm -it s43-setup --password-hash
  # ---------------------------------------------------------------------------
  s43-setup:
    build:
      context: .
      dockerfile: core/api/Dockerfile
    container_name: s43_setup
    # Override uvicorn — this container runs the generator and exits.
    entrypoint: ["python", "scripts/generate_secrets.py"]
    # Default: print to stdout. Override with --write /app/.env on the command line.
    command: []
    volumes:
      # Bind-mount the repo root so --write can update the host .env file.
      - type: bind
        source: .
        target: /app
    profiles:
      - setup
    environment:
      # Development mode prevents bootstrap_expectations() from demanding
      # production secrets that don't exist yet — that's the whole point
      # of running setup first.
      SENTINEL_ENV: development
    # No network access. The generator is pure filesystem I/O.
    network_mode: none
    restart: "no"

# -----------------------------------------------------------------------------
# Volumes and Networks
# -----------------------------------------------------------------------------
volumes:
  s43_pgdata:
  sentinel43_state:

networks:
  s43_net:
    driver: bridge