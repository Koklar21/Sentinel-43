# =============================================================================
# Sentinel-43 controlled-beta override.
#
# Usage (always both files, in this order):
#   docker compose -f docker-compose.yml -f docker-compose.beta.yml --env-file .env up -d
#
# The base file keeps local-development defaults. This override does not weaken
# anything: it makes the beta-required security settings mandatory, so Compose
# refuses to render or start if they are missing from .env, instead of silently
# falling back to the permissive development default.
# =============================================================================
services:
  s43-api:
    environment:
      # Session-only authentication: no per-request X-S43-Password fallback.
      S43_REJECT_LEGACY_AUTH: ${S43_REJECT_LEGACY_AUTH:?set S43_REJECT_LEGACY_AUTH=true in .env for a beta target}
      # The Heart (human-governed threat staging) must be an explicit choice.
      S43_HEART_ENABLED: ${S43_HEART_ENABLED:?set S43_HEART_ENABLED=true in .env for a beta target}
      # A failed Heart blocks /ready (fail closed).
      S43_HEART_REQUIRED: "true"
      # The Heart decides nothing itself: every recommendation is staged and
      # resolved by the governance orchestrator, and an enabled Heart without
      # it fails to start and keeps /ready false. Required, like the Heart.
      S43_GOVERNANCE_ENABLED: ${S43_GOVERNANCE_ENABLED:?set S43_GOVERNANCE_ENABLED=true in .env for a beta target}
      S43_GOVERNANCE_REQUIRED: "true"
      # Break-glass stays disarmed in the beta package. It could not be used
      # anyway: the env-operator login is refused outside local/dev/test,
      # armed or not.
      S43_BREAK_GLASS_ARMED: "false"
